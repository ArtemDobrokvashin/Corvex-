server:
  port: 8085
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${CORVEX_JWK_SET_URI:http://auth-service:8081/oauth2/jwks}
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://elasticsearch:9200}
    username: ${ELASTIC_USERNAME:elastic}
    password: ${ELASTIC_PASSWORD:}
  application:
    name: mail-storage-service
  servlet:
    multipart:
      # Один предел на весь путь: nginx (infra/nginx/nginx.conf, client_max_body_size
      # 26m) → сервер (26MB запрос) → вложения письма (20 МиБ суммарно, base64
      # добавляет ~33 %). Раньше было 8MB, и письмо с вложением 4 МиБ получало
      # ответ «413» без объяснения, хотя клиент считал его допустимым.
      max-file-size: 20MB
      max-request-size: 26MB
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:postgres}:5432/mail_db
    username: ${POSTGRES_USER:corvex}
    password: ${POSTGRES_PASSWORD:change-me}
    hikari: { maximum-pool-size: 10, minimum-idle: 2 }
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:corvex}
    password: ${RABBITMQ_PASSWORD:change-me}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
management:
  endpoints.web.exposure.include: health,info,prometheus,metrics
  endpoint.health.probes.enabled: true
  metrics.tags.application: mail-storage-service
logging:
  # Структурные JSON-логи -> Promtail -> Loki (см. docs/ARCHITECTURE.md)
  pattern.console: '%d{yyyy-MM-dd''T''HH:mm:ss.SSSXXX} [%thread] %-5level %logger{36} [%X{requestId}] - %msg%n'
corvex:
  auth:
    base-url: ${CORVEX_AUTH_SERVICE_URL:http://auth-service:8081}
  mail:
    domains: ${CORVEX_MAIL_DOMAINS:company.local}
    root: ${CORVEX_MAIL_ROOT:/data/mail}
    attachments: ${CORVEX_ATTACHMENT_ROOT:/data/attachments}
    spool: ${CORVEX_MAIL_SPOOL:/data/mail/_spool}
    # Единый лимит входящего .eml: storage проверяет его потоково ДО попадания письма в heap/Maildir.
    max-message-bytes: ${CORVEX_MAIL_MAX_MESSAGE_BYTES:26214400}
  # Календарь: события в этой БД, напоминания отправляет notification-service.
  calendar:
    reminders-enabled: ${CORVEX_CALENDAR_REMINDERS_ENABLED:true}
    reminder-delay-ms: ${CORVEX_CALENDAR_REMINDER_DELAY_MS:60000}
    notification-base-url: ${CORVEX_NOTIFICATION_SERVICE_URL:http://notification-service:8091}
  # Подключение собственных доменов: MX/SPF/DKIM проверяются по реальным DNS.
  domains:
    expected-mx-hosts: ${CORVEX_DOMAIN:mail.company.local}
    dkim-selector: ${CORVEX_DKIM_SELECTOR:corvex1}
    # Публичный ключ отправителя; пусто = соответствие DKIM не подтверждается.
    dkim-key-url: ${CORVEX_DKIM_KEY_URL:http://mail-smtp-service:8082/internal/dkim/public-key}
    max-check-age-seconds: ${CORVEX_DOMAIN_CHECK_MAX_AGE_SECONDS:3600}
    james-request-timeout-seconds: ${CORVEX_DOMAIN_JAMES_TIMEOUT_SECONDS:120}
    # Реестр подтверждённых доменов читается не чаще TTL; после max-stale
    # устаревшее значение перестаёт считаться доказательством «домен чужой».
    registry-ttl-seconds: ${CORVEX_DOMAIN_REGISTRY_TTL_SECONDS:30}
    registry-max-stale-seconds: ${CORVEX_DOMAIN_REGISTRY_MAX_STALE_SECONDS:300}
  external-mail:
    enabled: ${CORVEX_EXTERNAL_MAIL_ENABLED:true}
    enc-key: ${CORVEX_EXTERNAL_MAIL_ENC_KEY:}
    allow-custom-hosts: ${CORVEX_EXTERNAL_MAIL_ALLOW_CUSTOM_HOSTS:true}
    allow-private-networks: ${CORVEX_EXTERNAL_MAIL_ALLOW_PRIVATE_NETWORKS:false}
    allow-insecure-plain: ${CORVEX_EXTERNAL_MAIL_ALLOW_INSECURE_PLAIN:false}
    max-accounts-per-user: ${CORVEX_EXTERNAL_MAIL_MAX_ACCOUNTS_PER_USER:10}
    batch-size: ${CORVEX_EXTERNAL_MAIL_BATCH_SIZE:200}
  security:
    internal-token: ${CORVEX_INTERNAL_API_TOKEN:}
    # Публичный ключ auth-service (JWKS): каждый сервис сам валидирует JWT (RS256)
    jwk-set-uri: ${CORVEX_JWK_SET_URI:http://auth-service:8081/oauth2/jwks}
