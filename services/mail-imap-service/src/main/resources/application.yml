server:
  port: 8083
spring:
  application:
    name: mail-imap-service
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:corvex}
    password: ${RABBITMQ_PASSWORD:change-me}
management:
  endpoints.web.exposure.include: health,info,prometheus,metrics
  endpoint.health.probes.enabled: true
  metrics.tags.application: mail-imap-service
logging:
  # Структурные JSON-логи -> Promtail -> Loki (см. docs/01-architecture.md)
  pattern.console: '%d{yyyy-MM-dd''T''HH:mm:ss.SSSXXX} [%thread] %-5level %logger{36} [%X{requestId}] - %msg%n'
corvex:
  security:
    # Публичный ключ auth-service (JWKS): каждый сервис сам валидирует JWT (RS256)
    jwk-set-uri: ${CORVEX_JWK_SET_URI:http://auth-service:8081/oauth2/jwks}
    internal-token: ${CORVEX_INTERNAL_API_TOKEN:}
  auth:
    base-url: ${CORVEX_AUTH_SERVICE_URL:http://auth-service:8081}
  storage:
    base-url: ${CORVEX_STORAGE_BASE_URL:http://mail-storage-service:8085}
  imap:
    # Apache James IMAP выключен по умолчанию до первого mvn verify + smoke реальным клиентом на хосте с JDK.
    enabled: ${CORVEX_IMAP_ENABLED:false}
    bind-address: ${CORVEX_IMAP_BIND:0.0.0.0}
    # Контейнерные порты без root: compose публикует 143->1143 и 993->1993.
    plain-enabled: ${CORVEX_IMAP_PLAIN_ENABLED:true}
    plain-port: ${CORVEX_IMAP_PLAIN_PORT:1143}
    starttls-enabled: ${CORVEX_IMAP_STARTTLS:true}
    tls-enabled: ${CORVEX_IMAP_TLS_ENABLED:true}
    tls-port: ${CORVEX_IMAP_TLS_PORT:1993}
    require-tls-for-auth: ${CORVEX_IMAP_REQUIRE_TLS_FOR_AUTH:false}
    plain-auth-enabled: ${CORVEX_IMAP_PLAIN_AUTH_ENABLED:true}
    # TLS-материал: либо PKCS12/JKS keystore, либо PEM cert+key. В compose каталог сертификатов монтируется в /certs:ro.
    keystore-path: ${CORVEX_IMAP_KEYSTORE_PATH:}
    keystore-password: ${CORVEX_IMAP_KEYSTORE_PASSWORD:}
    keystore-type: ${CORVEX_IMAP_KEYSTORE_TYPE:PKCS12}
    certificate-path: ${CORVEX_IMAP_CERT_PATH:}
    private-key-path: ${CORVEX_IMAP_PRIVATE_KEY_PATH:}
    hello-name: ${CORVEX_IMAP_HELLO_NAME:${MAIL_HOSTNAME:${CORVEX_MAIL_DOMAIN:localhost}}}
    disabled-caps: ${CORVEX_IMAP_DISABLED_CAPS:}
    literal-size-limit-bytes: ${CORVEX_IMAP_LITERAL_SIZE_LIMIT_BYTES:26214400}
    in-memory-size-limit-bytes: ${CORVEX_IMAP_IN_MEMORY_SIZE_LIMIT_BYTES:10485760}
    max-line-length: ${CORVEX_IMAP_MAX_LINE_LENGTH:65536}
    connection-timeout-seconds: ${CORVEX_IMAP_CONNECTION_TIMEOUT_SECONDS:1800}
    idle-heartbeat-seconds: ${CORVEX_IMAP_IDLE_HEARTBEAT_SECONDS:120}
    max-connections: ${CORVEX_IMAP_MAX_CONNECTIONS:0}
    max-connections-per-ip: ${CORVEX_IMAP_MAX_CONNECTIONS_PER_IP:0}
