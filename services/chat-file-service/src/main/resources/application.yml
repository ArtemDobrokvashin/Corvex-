server:
  port: 8089
spring:
  application:
    name: chat-file-service
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${CORVEX_JWK_SET_URI:http://auth-service:8081/oauth2/jwks}
  servlet:
    multipart:
      # Сервис дополнительно ограничивает размер потоково в момент записи на диск.
      max-file-size: ${CORVEX_CHAT_FILE_MAX_FILE_SIZE:25MB}
      max-request-size: ${CORVEX_CHAT_FILE_MAX_REQUEST_SIZE:26MB}
management:
  endpoints.web.exposure.include: health,info,prometheus,metrics
  endpoint.health.probes.enabled: true
  metrics.tags.application: chat-file-service
logging:
  # Структурные JSON-логи -> Promtail -> Loki (см. docs/01-architecture.md)
  pattern.console: '%d{yyyy-MM-dd''T''HH:mm:ss.SSSXXX} [%thread] %-5level %logger{36} [%X{requestId}] - %msg%n'
corvex:
  chat:
    base-url: ${CORVEX_CHAT_SERVICE_URL:http://chat-service:8088}
  clamd:
    host: ${CORVEX_CLAMD_HOST:clamav}
    port: ${CORVEX_CLAMD_PORT:3310}
  files:
    root: ${CORVEX_CHAT_FILE_ROOT:/data/chat-files}
    max-bytes: ${CORVEX_CHAT_FILE_MAX_BYTES:26214400}
    # Fail-closed по умолчанию: при недоступном ClamAV файл не публикуется.
    av-required: ${CORVEX_CHAT_FILE_AV_REQUIRED:true}
  security:
    internal-token: ${CORVEX_INTERNAL_API_TOKEN:}
    # Публичный ключ auth-service (JWKS): каждый сервис сам валидирует JWT (RS256)
    jwk-set-uri: ${CORVEX_JWK_SET_URI:http://auth-service:8081/oauth2/jwks}
