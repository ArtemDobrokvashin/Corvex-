server:
  port: 8082
spring:
  application:
    name: mail-smtp-service
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:corvex}
    password: ${RABBITMQ_PASSWORD:change-me}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
management:
  endpoints.web.exposure.include: health,info,prometheus,metrics
  endpoint.health.probes.enabled: true
  metrics.tags.application: mail-smtp-service
logging:
  # Структурные JSON-логи -> Promtail -> Loki (см. docs/01-architecture.md)
  pattern.console: '%d{yyyy-MM-dd''T''HH:mm:ss.SSSXXX} [%thread] %-5level %logger{36} [%X{requestId}] - %msg%n'
corvex:
  auth:
    base-url: ${CORVEX_AUTH_SERVICE_URL:http://auth-service:8081}
  admin:
    base-url: ${CORVEX_ADMIN_SERVICE_URL:http://admin-service:8090}
  storage:
    base-url: ${CORVEX_STORAGE_BASE_URL:http://mail-storage-service:8085}
  dkim:
    domain: ${CORVEX_DKIM_DOMAIN:${CORVEX_MAIL_DOMAIN:company.local}}
    selector: ${CORVEX_DKIM_SELECTOR:corvex1}
    private-key-file: ${CORVEX_DKIM_PRIVATE_KEY_FILE:/run/secrets/dkim_private.pem}
  outbound:
    require-starttls: ${CORVEX_SMTP_REQUIRE_STARTTLS:false}
  external-mail:
    allow-private-networks: ${CORVEX_EXTERNAL_MAIL_ALLOW_PRIVATE_NETWORKS:false}
    allow-insecure-plain: ${CORVEX_EXTERNAL_MAIL_ALLOW_INSECURE_PLAIN:false}
  smtp:
    enabled: ${CORVEX_SMTP_ENABLED:false}
    inbound-port: 2525
    submission-port: 2587
    hostname: ${CORVEX_DOMAIN:mail.company.local}
    tls:
      cert-chain-file: ${CORVEX_SMTP_TLS_CERT_FILE:/certs/fullchain.pem}
      private-key-file: ${CORVEX_SMTP_TLS_KEY_FILE:/certs/privkey.pem}
  mail:
    domains: ${CORVEX_MAIL_DOMAINS:company.local}
  security:
    internal-token: ${CORVEX_INTERNAL_API_TOKEN:}
    # Публичный ключ auth-service (JWKS): каждый сервис сам валидирует JWT (RS256)
    jwk-set-uri: ${CORVEX_JWK_SET_URI:http://auth-service:8081/oauth2/jwks}
