openapi: 3.0.3
info:
  title: Corvex Admin API
  version: 1.0.0
  description: Пользователи, группы и чекбоксы прав, квоты, настройки, аудит, аналитика. Каждое действие пишется в audit_log.
servers:
  - url: https://mail.company.local/api/v1
paths:
  /admin/users:
    get:
      summary: Список пользователей (ADMIN_USERS_MANAGE или ADMIN_QUOTAS_MANAGE), фильтр по статусу и подразделению
      description: usedBytes вычисляется batch-запросом в mail-storage; null означает временную недоступность хранилища, а не нулевой объём
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [ACTIVE, BLOCKED, DISABLED] } }
        - { name: department, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, default: 0 } }
        - { name: size, in: query, schema: { type: integer, default: 50 } }
      responses: { '200': { description: Страница пользователей }, '403': { description: Нет права ADMIN_USERS_MANAGE или ADMIN_QUOTAS_MANAGE } }
    post:
      summary: Создать локального пользователя (ящик и системные папки создаются транзакционно через события)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, displayName, tempPassword]
              properties:
                username: { type: string }
                email: { type: string, format: email }
                displayName: { type: string }
                tempPassword: { type: string, format: password }
                department: { type: string }
                groupCodes: { type: array, items: { type: string }, default: [USER] }
                quotaBytes: { type: integer, format: int64 }
      responses: { '201': { description: Создан }, '409': { description: Логин или email занят } }
  /admin/users/{userId}:
    patch:
      summary: Изменить профиль/квоту/подразделение (только ADMIN_USERS_MANAGE)
      parameters: [{ name: userId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Обновлён }, '403': { description: Нет права ADMIN_USERS_MANAGE } }
    delete:
      summary: Отключить пользователя, отозвать сессии и снять группы; учётная запись не стирается физически
      parameters: [{ name: userId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '204': { description: Пользователь отключён } }
  /admin/users/{userId}/quota:
    patch:
      summary: Изменить только дисковую квоту (ADMIN_USERS_MANAGE или ADMIN_QUOTAS_MANAGE); 0 — без лимита
      parameters: [{ name: userId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quotaBytes]
              properties:
                quotaBytes: { type: integer, format: int64, minimum: 0 }
      responses:
        '200': { description: Квота сохранена в auth-service; записан USER_QUOTA_CHANGED }
        '400': { description: quotaBytes отсутствует или отрицателен }
        '403': { description: Нет права ADMIN_USERS_MANAGE или ADMIN_QUOTAS_MANAGE }
        '404': { description: Пользователь не найден }
  /admin/users/{userId}/block:
    post:
      summary: Заблокировать и отозвать все сессии
      parameters: [{ name: userId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '204': { description: Заблокирован } }
  /admin/users/{userId}/password-reset:
    post:
      summary: Сбросить пароль локального пользователя; только JWT с группой SUPER_ADMIN и правом ADMIN_USERS_MANAGE
      description: Устанавливает временный пароль и mustChangePassword=true, отзывает все refresh-сессии. Статус, группы, TOTP и app passwords не изменяются. Старый и новый пароли не возвращаются и не попадают в аудит; записывается только USER_PASSWORD_RESET с actor/target.
      parameters: [{ name: userId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newPassword]
              properties:
                newPassword: { type: string, format: password, minLength: 10, maxLength: 128 }
      responses:
        '204': { description: Временный пароль установлен; при следующем входе пользователь обязан его сменить }
        '400': { description: Новый пароль совпадает с текущим }
        '403': { description: Нет ADMIN_USERS_MANAGE или членства SUPER_ADMIN }
        '404': { description: Пользователь не найден }
        '422': { description: Слабый пароль или учётная запись AD/LDAP }
  /admin/users/{userId}/groups:
    put:
      summary: Назначить группы пользователя (полная замена)
      parameters: [{ name: userId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [groupCodes], properties: { groupCodes: { type: array, items: { type: string } } } }
      responses: { '200': { description: Группы обновлены, действующие access-токены живут до своего TTL ≤15 мин } }
  /admin/groups:
    get:
      summary: Все группы с правами (для экрана чекбоксов)
      responses:
        '200':
          description: Группы
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    code: { type: string }
                    name: { type: string }
                    isSystem: { type: boolean }
                    enabled: { type: boolean }
                    permissions: { type: array, items: { type: string } }
    post:
      summary: Создать пользовательскую группу
      responses: { '201': { description: Создана } }
  /admin/groups/{groupCode}:
    delete:
      summary: Удалить пустую пользовательскую группу (ADMIN_GROUPS_MANAGE)
      parameters:
        - { name: groupCode, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Удалена, событие записано в аудит }
        '403': { description: Нет права на управление группами }
        '404': { description: Группа не найдена }
        '409': { description: В группе есть участники }
        '422': { description: Системная группа защищена }
  /admin/groups/{groupCode}/permissions:
    put:
      summary: Сохранить чекбоксы прав группы (ADMIN_GROUPS_MANAGE)
      parameters: [{ name: groupCode, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [permissions], properties: { permissions: { type: array, items: { type: string, enum: [MAIL_READ_OWN, MAIL_SEND_INTERNAL, MAIL_SEND_EXTERNAL, MAIL_MANAGE_FOLDERS, MAIL_BULK_SEND, MAIL_DELEGATE_ACCESS, MAIL_EXPORT, CHAT_READ, CHAT_WRITE, CHAT_CREATE_GROUP, CHAT_CREATE_CHANNEL, CHAT_MODERATE, CHAT_SEND_FILES, CHAT_VOICE_VIDEO, ADMIN_USERS_MANAGE, ADMIN_GROUPS_MANAGE, ADMIN_QUOTAS_MANAGE, ADMIN_SECURITY_POLICY, ADMIN_MAIL_POLICY, ADMIN_SERVER_CONFIG, ADMIN_BACKUP, ANALYTICS_VIEW_OWN_UNIT, ANALYTICS_VIEW_COMPANY, AUDIT_VIEW] } } } }
      responses: { '200': { description: Права сохранены }, '422': { description: Попытка отнять у SUPER_ADMIN критичные права отклонена } }
  /admin/settings:
    get:
      summary: Реестр серверных настроек; наличие ключа не подтверждает наличие runtime-потребителя
      responses: { '200': { description: Карта настроек из server_settings } }
    patch:
      summary: Сохранить и аудировать настройки; применение зависит от потребителей конкретного ключа
      responses: { '200': { description: Сохранено в server_settings; не подтверждает применение работающими сервисами } }
  /admin/alerts/settings:
    get:
      summary: Runtime-настройки алертов; только JWT с группой SUPER_ADMIN и правом ADMIN_SERVER_CONFIG
      responses:
        '200':
          description: Несекретные значения и secret configured/source; plaintext secrets никогда не возвращаются
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertSettingsView' }
        '403': { description: Нет ADMIN_SERVER_CONFIG или членства SUPER_ADMIN }
        '503': { description: Эффективная alert-конфигурация повреждена или содержит невалидный env fallback }
    put:
      summary: Атомарно заменить runtime-настройки алертов и увеличить revision
      description: Blank secret сохраняет прежний ciphertext; clear* удаляет UI-secret и возвращает env fallback. Значения секретов не попадают в audit details.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlertSettingsRequest' }
      responses:
        '200':
          description: Сохранённая revision; фактическое применение проверяется отдельным /runtime endpoint
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertSettingsView' }
        '403': { description: Не суперадминистратор }
        '422': { description: Невалидные recipients, repeat, категории, TLS или channel target }
        '503': { description: Не настроен ключ для нового UI-secret, не расшифровывается сохранённый секрет или невалиден effective config }
  /admin/alerts/runtime:
    get:
      summary: Фактически загруженные revision у notification-service и alert-relay; только SUPER_ADMIN
      responses:
        '200':
          description: APPLIED только при совпадении revision; UNAVAILABLE не маскируется под успех
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertRuntimeStatus' }
        '403': { description: Не суперадминистратор }
        '503': { description: Не удалось прочитать effective config; недоступность отдельного consumer возвращается как UNAVAILABLE в 200 }
  /admin/alerts/telegram/discover:
    post:
      summary: Найти чаты по /start, /id или /help для явного выбора суперадминистратором
      description: Blank botToken использует effective UI/env-secret в alert-relay. Ответ содержит только username бота и metadata чатов, но не token или тексты сообщений. Discovery не подтверждает updates и не выбирает получателя автоматически.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TelegramDiscoveryRequest' }
      responses:
        '200':
          description: Найденные чаты; пустой список требует сначала отправить боту /start и не означает успешное подключение
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TelegramDiscoveryView' }
        '403': { description: Не суперадминистратор }
        '422': { description: Telegram token отсутствует, имеет неверный формат или отклонён }
        '502': { description: Telegram API или alert-relay недоступен; sanitized error без token/response body }
        '503': { description: Не настроен internal API token }
  /admin/audit:
    get:
      summary: Журнал аудита (AUDIT_VIEW) — кто, что, когда, с какого IP
      parameters:
        - { name: actorId, in: query, schema: { type: string, format: uuid } }
        - { name: action, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: page, in: query, schema: { type: integer, default: 0 } }
        - { name: size, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses: { '200': { description: Записи аудита } }
  /admin/analytics/activity:
    get:
      summary: Учётные записи и входы за 24 часа/7 дней (ANALYTICS_VIEW_COMPANY или _OWN_UNIT), без содержимого писем и сообщений
      parameters:
        - name: period
          in: query
          description: Зарезервировано; текущий backend игнорирует параметр и возвращает фиксированные окна 24 часа и 7 дней
          schema: { type: string, enum: [day, week, month] }
        - name: department
          in: query
          description: Фильтр для COMPANY; для OWN_UNIT сервер использует только подразделение текущего пользователя
          schema: { type: string }
      responses:
        '200':
          description: Агрегаты; null в loginsLast24h/loginsLast7d означает недоступность статистики, а не ноль
          content:
            application/json:
              schema:
                type: object
                properties:
                  scope: { type: string, enum: [COMPANY, OWN_UNIT] }
                  department: { type: string, nullable: true }
                  usersTotal: { type: integer, format: int64 }
                  usersActive: { type: integer, format: int64 }
                  usersBlocked: { type: integer, format: int64 }
                  usersDisabled: { type: integer, format: int64 }
                  loginsLast24h: { type: integer, format: int64, nullable: true }
                  loginsLast7d: { type: integer, format: int64, nullable: true }
                  generatedAt: { type: string, format: date-time }
  /admin/system/health:
    get:
      summary: Сводное здоровье всех сервисов и очередей для дашборда админки
      responses:
        '200':
          description: Состояния
          content:
            application/json:
              schema: { type: object, properties: { services: { type: array, items: { type: object, properties: { name: { type: string }, status: { type: string, enum: [UP, DOWN, DEGRADED] }, version: { type: string } } } }, diskFreeBytes: { type: integer, format: int64 }, mailQueueDepth: { type: integer } } }
  /admin/backup/run:
    post:
      summary: Зафиксировать BACKUP_REQUESTED в аудите (ADMIN_BACKUP); физический backup не запускается
      responses:
        '202':
          description: Запрос зарегистрирован; копирование выполняет scripts/backup.ps1 на хосте по расписанию
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [REQUESTED] }
                  note: { type: string }
components:
  schemas:
    AlertSecretState:
      type: object
      required: [configured, source]
      properties:
        configured: { type: boolean }
        source: { type: string, enum: [UI, ENVIRONMENT, NONE] }
    AlertSettingsBase:
      type: object
      required: [repeatNormalMinutes, repeatCriticalMinutes, categories, internalEmailEnabled, externalEmailEnabled, externalSmtpPort, externalSmtpTlsMode, telegramEnabled, maxEnabled]
      properties:
        repeatNormalMinutes: { type: integer, minimum: 1, maximum: 43200 }
        repeatCriticalMinutes: { type: integer, minimum: 1, maximum: 43200 }
        categories:
          type: object
          description: Пять ключей ServiceDown, HighHttp5xxRate, MailQueueBacklog, DiskSpaceLow, JvmMemoryPressure
          additionalProperties: { type: boolean }
        internalEmailEnabled: { type: boolean }
        internalRecipients: { type: string, description: Comma-separated email addresses }
        internalFrom: { type: string, format: email }
        externalEmailEnabled: { type: boolean }
        externalEmailRecipients: { type: string }
        externalSmtpHost: { type: string }
        externalSmtpPort: { type: integer, minimum: 1, maximum: 65535 }
        externalSmtpTlsMode: { type: string, enum: [starttls, ssl] }
        externalSmtpUsername: { type: string }
        externalSmtpFrom: { type: string }
        telegramEnabled: { type: boolean }
        telegramChatId: { type: string, pattern: '^-?[0-9]{1,32}$', description: 'Числовой ID пользователя/группы/канала, не username и не @username; примеры 123456789 или -1001234567890' }
        maxEnabled: { type: boolean }
        maxChatId: { type: string, pattern: '^-?[0-9]{1,32}$', description: 'Числовой ID без @/username; заполняется ровно один из maxChatId/maxUserId при включённом MAX' }
        maxUserId: { type: string, pattern: '^-?[0-9]{1,32}$', description: 'Числовой ID пользователя без @/username' }
    AlertSettingsView:
      allOf:
        - $ref: '#/components/schemas/AlertSettingsBase'
        - type: object
          properties:
            revision: { type: integer, format: int64, minimum: 0 }
            updatedAt: { type: string, format: date-time, nullable: true }
            source: { type: string, enum: [DATABASE, ENVIRONMENT] }
            externalSmtpPassword: { $ref: '#/components/schemas/AlertSecretState' }
            telegramBotToken: { $ref: '#/components/schemas/AlertSecretState' }
            maxBotToken: { $ref: '#/components/schemas/AlertSecretState' }
    AlertSettingsRequest:
      allOf:
        - $ref: '#/components/schemas/AlertSettingsBase'
        - type: object
          properties:
            externalSmtpPassword: { type: string, format: password, writeOnly: true, maxLength: 4096 }
            clearExternalSmtpPassword: { type: boolean, default: false }
            telegramBotToken: { type: string, format: password, writeOnly: true, maxLength: 4096 }
            clearTelegramBotToken: { type: boolean, default: false }
            maxBotToken: { type: string, format: password, writeOnly: true, maxLength: 4096 }
            clearMaxBotToken: { type: boolean, default: false }
    AlertConsumerStatus:
      type: object
      properties:
        consumer: { type: string, enum: [notification-service, alert-relay] }
        status: { type: string, enum: [APPLIED, PENDING, UNAVAILABLE] }
        revision: { type: integer, format: int64, nullable: true }
        source: { type: string }
        refresh: { type: string }
        updatedAt: { type: string, format: date-time, nullable: true }
    AlertRuntimeStatus:
      type: object
      properties:
        revision: { type: integer, format: int64 }
        consumers:
          type: array
          items: { $ref: '#/components/schemas/AlertConsumerStatus' }
    TelegramDiscoveryRequest:
      type: object
      properties:
        botToken:
          type: string
          format: password
          writeOnly: true
          maxLength: 512
          description: Новый token для discovery; пустая строка использует уже сохранённый effective secret
    TelegramChatView:
      type: object
      required: [id, type, title]
      properties:
        id: { type: string, pattern: '^-?[0-9]{1,32}$' }
        type: { type: string, description: private, group, supergroup или channel }
        title: { type: string, description: Отображаемое имя без текста сообщения }
    TelegramDiscoveryView:
      type: object
      required: [botUsername, chats]
      properties:
        botUsername: { type: string, description: Public username без token }
        chats:
          type: array
          items: { $ref: '#/components/schemas/TelegramChatView' }
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
security:
  - bearerAuth: []
