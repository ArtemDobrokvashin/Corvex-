openapi: 3.0.3
info:
  title: Corvex Mail API
  version: 1.0.0
  description: |
    REST API веб-клиента почты поверх mail-storage-service (отправка уходит в mail-smtp-service через RabbitMQ).
    Внешние клиенты ходят не сюда, а по IMAP/POP3/SMTP. Списки — курсорная пагинация, тела писем отдаются
    санитизированным HTML (XSS) + plain text.
    Операции с расширением x-corvex-status: planned описаны как замысел: в коде их нет,
    и вызывать их не следует. Пометка может стоять на уровне пути (все операции пути)
    или на уровне одной операции, если остальные в этом пути уже работают.
servers:
  - url: https://mail.company.local/api/v1
paths:
  /mail/quota:
    get:
      summary: Фактические usedBytes/quotaBytes текущего ящика из JWT subject (MAIL_READ_OWN); 0 — без лимита
      responses:
        '200':
          description: Агрегаты message_metadata и актуальный лимит auth-service
          content:
            application/json:
              schema:
                type: object
                properties:
                  usedBytes: { type: integer, format: int64 }
                  quotaBytes: { type: integer, format: int64 }
                  messageCount: { type: integer, format: int64 }
        '403': { description: Нет права MAIL_READ_OWN }
  /mail/folders:
    get:
      summary: Дерево папок текущего пользователя со счётчиками непрочитанных
      responses:
        '200':
          description: Папки
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    name: { type: string }
                    specialUse: { type: string, enum: [INBOX, SENT, DRAFTS, TRASH, SPAM, ARCHIVE], nullable: true }
                    unread: { type: integer, format: int64 }
                    total: { type: integer, format: int64 }
    post:
      summary: Создать папку (MAIL_MANAGE_FOLDERS)
      description: >-
        Имя не может быть точкой, содержать /, обратную косую черту, %, *, две точки подряд
        или управляющие символы. После преобразования файловый сегмент не должен превышать 255 байт.
        Текущее плоское Maildir-хранилище может считать разные имена одинаковыми после преобразования
        в безопасный файловый сегмент; такой конфликт возвращает 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties: { name: { type: string }, parentId: { type: string, format: uuid, nullable: true } }
      responses:
        '201':
          description: Созданная папка (счётчики total и unread равны нулю)
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
                  specialUse: { type: string, nullable: true }
                  total: { type: integer, format: int64 }
                  unread: { type: integer, format: int64 }
        '400': { description: Недопустимое имя }
        '403': { description: Нет права MAIL_MANAGE_FOLDERS }
        '404': { description: Родительская папка не принадлежит пользователю или не найдена }
        '409': { description: Имя занято, зарезервировано или конфликтует с другой папкой в файловом хранилище }
  /mail/folders/{folderId}:
    patch:
      x-corvex-status: planned
      summary: Переименовать/переместить папку (системные переименовывать нельзя)
      description: |
        В коде не реализовано: MailController отдаёт GET/POST `/folders` и
        DELETE `/folders/{folderId}`, PATCH отсутствует, в интерфейсе переименования
        папок нет. Нужно, чтобы `docs/MAIL.md` (сериализация имён каталогов)
        и `docs/USER-GUIDE.md` не обещали того, чего нет.
      parameters: [{ name: folderId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Обновлена } }
    delete:
      summary: Удалить пустую личную папку (MAIL_MANAGE_FOLDERS); системные и непустые папки не удаляются
      parameters: [{ name: folderId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '204': { description: Удалена }, '404': { description: Не найдена }, '409': { description: Системная папка, есть письма или вложенные папки } }
  /mail/folders/{folderId}/messages:
    get:
      summary: Список писем папки (курсор по internalDate+id, только метаданные и сниппет)
      parameters:
        - { name: folderId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: sort, in: query, schema: { type: string, enum: [dateDesc, dateAsc], default: dateDesc } }
      responses:
        '200':
          description: Страница писем
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/MessageSummary' } }
                  nextCursor: { type: string, nullable: true }
  /mail/messages/{messageId}:
    get:
      summary: Полное письмо — заголовки, санитизированный HTML, plain text, список вложений
      parameters: [{ name: messageId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Письмо, content: { application/json: { schema: { $ref: '#/components/schemas/MessageDetail' } } } }
    delete:
      x-corvex-status: planned
      summary: В Корзину; из Корзины — окончательно
      description: |
        В коде не реализовано. Сейчас удаление — это `POST /mail/messages/{id}/move`
        в системную папку TRASH; окончательное удаление живёт только во внутреннем
        контуре (`DELETE /internal/messages/{id}`, им пользуются IMAP/POP3).
        План: удаление из корзины, «Очистить корзину» и автоочистка 30/60/90 дней —
        `docs/ROADMAP.md`.
      parameters: [{ name: messageId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '204': { description: Готово } }
  /mail/messages/{messageId}/inline-image:
    post:
      summary: Прочитать картинку из HTML-письма по Content-ID (cid:)
      description: |
        POST здесь из-за тела запроса, хотя операция только читает. Санитизация HTML
        вырезает `cid:`-ссылки, поэтому клиент просит картинку отдельно: тело
        `{"cid": "<Content-ID>"}`, ответ — байты изображения с его `Content-Type`,
        `nosniff` и `private, no-store`. Владелец берётся из JWT, чужое письмо — `404`.

        Отдаются только `image/png`, `image/jpeg`, `image/gif` целиком в одном MIME-части,
        до 3 МиБ и 16 Мпикс. Каждая картинка заново проверяется ClamAV: заражённая — `403`,
        недоступный антивирус — `503` (fail-closed).
      parameters: [{ name: messageId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cid]
              properties:
                cid: { type: string, example: '<logo-1@example.com>' }
      responses:
        '200':
          description: Байты изображения, Content-Type из письма
          content:
            image/png:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
            image/gif:
              schema: { type: string, format: binary }
        '403': { description: Изображение заблокировано антивирусом }
        '404': { description: Письмо не найдено, чужое, или такого Content-ID нет }
        '503': { description: Антивирус недоступен }
  /mail/messages/{messageId}/flags:
    patch:
      summary: Изменить флаги (seen/flagged) — синхронизируется с IMAP-состоянием
      parameters: [{ name: messageId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: { seen: { type: boolean }, flagged: { type: boolean } }
      responses: { '200': { description: Флаги обновлены } }
  /mail/messages/bulk-move:
    x-corvex-status: planned
    post:
      summary: Пакетное перемещение писем в папку
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messageIds, targetFolderId]
              properties:
                messageIds: { type: array, items: { type: string, format: uuid }, maxItems: 1000 }
                targetFolderId: { type: string, format: uuid }
      responses: { '202': { description: Принято к выполнению (асинхронно при больших объёмах) } }
  /mail/messages/send:
    post:
      summary: Поставить письмо в очередь (MAIL_SEND_INTERNAL / MAIL_SEND_EXTERNAL проверяются по доменам получателей)
      description: >-
        Требуется хотя бы один адрес в to, cc или bcc (всего не более 100).
        Успешный ответ означает приём в очередь, а не подтверждённую доставку.
        Ключ идемпотентности не поддерживается: после тайм-аута или ошибки сервера
        часть получателей уже может быть в очереди, поэтому повтор может создать дубликаты.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                to: { type: array, items: { type: string, format: email } }
                cc: { type: array, items: { type: string, format: email } }
                bcc: { type: array, items: { type: string, format: email } }
                subject: { type: string, nullable: true }
                bodyText: { type: string, nullable: true }
                bodyHtml: { type: string, nullable: true }
                attachments:
                  type: array
                  items:
                    type: object
                    properties:
                      fileName: { type: string, nullable: true }
                      contentType: { type: string, nullable: true }
                      contentBase64: { type: string, format: byte, nullable: true }
                saveToSent: { type: boolean, nullable: true, default: true }
                externalAccountId: { type: string, format: uuid, nullable: true, description: "Подключённый внешний ящик для send-as через SMTP провайдера; null — адрес Corvex" }
                inReplyToMessageId: { type: string, format: uuid, nullable: true, description: "Идентификатор письма, на которое отвечаем. Сервер берёт его Message-ID и References для заголовков In-Reply-To/References. Чужое письмо молча игнорируется." }
                sendAt: { type: string, format: date-time, nullable: true, description: "«Отправить позже»: письмо собирается сейчас, а уходит по расписанию. Время в прошлом или дальше года — 422. Копия в «Отправленные» сохраняется сразу." }
      responses:
        '200':
          description: Письмо поставлено в очередь; sentMessageId может быть null, если копия в Sent не сохранена (например, из-за квоты)
          content:
            application/json:
              schema:
                type: object
                properties:
                  messageIdHeader: { type: string }
                  sentMessageId: { type: string, format: uuid, nullable: true }
                  localRecipients: { type: array, items: { type: string } }
                  externalRecipients: { type: array, items: { type: string } }
                  fromAddress: { type: string }
                  externalAccountId: { type: string, format: uuid, nullable: true }
                  scheduledSendId: { type: string, format: uuid, nullable: true, description: "Заполнен только для отложенного письма: по нему отправку отменяют." }
                  scheduledSendAt: { type: string, format: date-time, nullable: true }
        '400': { description: Некорректное вложение }
        '403': { description: Недостаточно прав на отправку }
        '409': { description: Выбранный внешний ящик не разрешает отправку }
        '413': { description: Превышен лимит размера письма }
        '422': { description: Некорректные получатели или время отложенной отправки вне допустимого окна }
  /mail/scheduled-sends:
    get:
      summary: Отложенные отправки пользователя (ещё не ушедшие письма)
      responses:
        '200':
          description: Список записей очереди
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    sendAt: { type: string, format: date-time }
                    status: { type: string, enum: [SCHEDULED, SENDING, FAILED] }
  /mail/scheduled-sends/{id}:
    delete:
      summary: Отменить отложенную отправку
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Отменено, спул-копия удалена }
        '409': { description: Письмо уже отправляется или отправлено — отменить нельзя }
  /mail/messages/{messageId}/snooze:
    post:
      summary: Отложить письмо до указанного момента (письмо не перемещается, UID не меняется)
      parameters:
        - { name: messageId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [wakeAt]
              properties:
                wakeAt: { type: string, format: date-time, description: "Время возврата. Прошлое или дальше года — 422." }
      responses:
        '200': { description: Письмо скрыто из списка папки до срока }
        '404': { description: Письмо не найдено или чужое }
        '422': { description: Недопустимое время возврата }
    delete:
      summary: Вернуть письмо в список раньше срока (идемпотентно)
      parameters:
        - { name: messageId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Письмо снова в списке }
  /mail/snoozed:
    get:
      summary: Письма, скрытые до указанного момента
      responses:
        '200':
          description: Список «спящих» писем
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    messageId: { type: string, format: uuid }
                    subject: { type: string }
                    sender: { type: string }
                    folderId: { type: string, format: uuid }
                    wakeAt: { type: string, format: date-time }
  /mail/settings:
    get:
      summary: Настройки почты пользователя (одни и те же на всех устройствах)
      responses:
        '200':
          description: Текущие настройки; для нового пользователя — умолчания
          content:
            application/json:
              schema:
                type: object
                properties:
                  density: { type: string, enum: [comfortable, compact] }
                  showPreview: { type: boolean }
                  conversations: { type: boolean }
                  markRead: { type: string, enum: [automatic, manual] }
                  defaultSort: { type: string, enum: [date-desc, date-asc, sender-asc, subject-asc, unread-first] }
                  signature: { type: string, maxLength: 5000 }
                  signatureForNew: { type: boolean }
                  signatureForReplies: { type: boolean }
                  notifications: { type: boolean }
                  signatureForSubmission: { type: boolean, description: "Подпись в письмах из Thunderbird/Outlook; по умолчанию выключено." }
    put:
      summary: Сохранить настройки (неизвестные значения заменяются умолчаниями, а не дают 400)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200': { description: Сохранённые и нормализованные настройки }
  /mail/drafts:
    get:
      summary: Список своих черновиков (свежие первыми, только метаданные)
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 50 }, description: '1–100, большее значение урезается до 100' }
      responses:
        '200':
          description: Черновики без тел и вложений
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/DraftSummary' } }
    post:
      summary: Создать черновик (автосохранение редактора)
      description: |
        POST только создаёт. Обновление — `PUT /mail/drafts/{draftId}` с номером
        ревизии: так две вкладки не перетирают текст друг друга молча (конфликт — 409).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DraftPayload' }
      responses:
        '201':
          description: Черновик сохранён, revision = 1
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DraftView' }
        '400': { description: Черновик не проходит валидацию или слишком велик }
        '403': { description: Нет права MAIL_READ_OWN }
  /mail/drafts/{draftId}:
    get:
      summary: Прочитать свой черновик целиком
      parameters: [{ name: draftId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: Черновик с payload и revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DraftView' }
        '404': { description: Черновик не найден или принадлежит другому пользователю }
    put:
      summary: Обновить черновик — только поверх известной ревизии
      parameters: [{ name: draftId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision, payload]
              properties:
                revision: { type: integer, format: int64, minimum: 1 }
                payload: { $ref: '#/components/schemas/DraftPayload' }
      responses:
        '200':
          description: Сохранено, revision увеличена
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DraftView' }
        '400': { description: Некорректная ревизия или payload }
        '404': { description: Черновик не найден }
        '409': { description: Черновик изменён в другой вкладке }
    delete:
      summary: Удалить черновик по известной ревизии
      parameters:
        - { name: draftId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: revision, in: query, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        '204': { description: Удалён }
        '400': { description: Некорректная ревизия }
        '404': { description: Черновик не найден }
        '409': { description: Черновик изменён в другой вкладке }
  /mail/attachments:
    x-corvex-status: planned
    post:
      summary: Загрузить вложение до отправки (потоково, AV-сканирование до публикации)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { type: object, properties: { file: { type: string, format: binary } } }
      responses:
        '201':
          description: Загружено
          content:
            application/json:
              schema: { type: object, properties: { sha256: { type: string }, sizeBytes: { type: integer, format: int64 }, avStatus: { type: string, enum: [PENDING, CLEAN, INFECTED, ERROR] } } }
  /mail/messages/{messageId}/attachments/{partIndex}/preview:
    get:
      summary: Предпросмотр Office-вложения как PDF
      description: |
        Права и антивирус те же, что у скачивания: заражённый или непроверенный файл
        не конвертируется. `501`, если контейнер предпросмотра не запущен, — интерфейс
        тогда предлагает скачать файл.
      parameters:
        - { name: messageId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: partIndex, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: PDF, inline disposition, no-store
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '403': { description: Вложение заблокировано антивирусом }
        '404': { description: Письмо или вложение не найдено либо принадлежит другому пользователю }
        '423': { description: Файл ещё не проверен }
        '501': { description: Предпросмотр Office выключен }
        '503': { description: Проверка или конвертация недоступна }
  /mail/messages/{messageId}/attachments/{partIndex}:
    get:
      summary: Скачать вложение своего письма с проверкой антивирусом
      description: Исторические, исходящие и другие непроверенные вложения повторно сканируются перед выдачей; при угрозе или недоступности ClamAV файл не выдаётся.
      parameters:
        - { name: messageId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: partIndex, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Файл, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        '403': { description: Вложение заблокировано антивирусом }
        '503': { description: Проверка недоступна }
        '404': { description: Письмо или вложение не найдено либо принадлежит другому пользователю }
  /mail/search:
    get:
      summary: Полнотекстовый поиск по всем письмам владельца (Elasticsearch — тема, отправитель, получатель, тело)
      description: |
        Понимает фильтры в стиле Gmail: `from:`, `subject:`, `to:`, `is:unread`,
        `is:read`, `has:attachment`, `before:YYYY-MM-DD`, `after:YYYY-MM-DD`.
        Остальные слова ищутся как текст. Владелец берётся из JWT: чужих писем
        выдача не содержит. `limit` ограничен сверху значением 100.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string }, example: 'from:buhgalteria счёт has:attachment after:2026-01-01' }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 100 } }
      responses:
        '200':
          description: Результаты с коротким превью (до 180 символов)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MailSearchResult' }
        '503': { description: Индекс поиска недоступен; это не пустой результат }
  /mail/external-accounts/presets:
    get:
      summary: Пресеты Mail.ru, Яндекс, Gmail и Outlook для формы подключения внешнего ящика
      responses:
        '200':
          description: Пресеты
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ExternalMailPreset' }
  /mail/external-accounts/owners:
    get:
      summary: Поиск активных сотрудников для подключения им внешних ящиков (ADMIN_MAIL_POLICY)
      parameters:
        - { name: q, in: query, required: false, schema: { type: string }, description: 'Имя, email, логин или отдел' }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 25, minimum: 1, maximum: 50 } }
      responses:
        '200':
          description: Сотрудники и количество уже подключённых внешних ящиков
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ExternalMailOwner' }
        '403': { description: Нет ADMIN_MAIL_POLICY }
  /mail/external-accounts/owners/{ownerId}:
    get:
      summary: Владелец внешнего ящика для администрирования (ADMIN_MAIL_POLICY)
      parameters: [{ name: ownerId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Профиль владельца и счётчик внешних ящиков }
        '400': { description: Пользователь не найден }
        '403': { description: Нет ADMIN_MAIL_POLICY }
  /mail/external-accounts/owners/{ownerId}/folders:
    get:
      summary: Папки выбранного владельца для администратора (ADMIN_MAIL_POLICY)
      parameters: [{ name: ownerId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: Папки владельца, включая полный путь вложенных папок
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ExternalMailTargetFolder' }
        '400': { description: Пользователь не найден }
        '403': { description: Нет ADMIN_MAIL_POLICY }
  /mail/external-accounts:
    get:
      summary: Внешние ящики владельца (MAIL_EXTERNAL_ACCOUNTS; ADMIN_MAIL_POLICY может указать ownerId)
      parameters:
        - { name: ownerId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Подключённые ящики без секретов
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ExternalMailAccount' }
    post:
      summary: Подключить внешний ящик сотруднику (только ADMIN_MAIL_POLICY); секрет сохраняется AES-256-GCM шифртекстом
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExternalMailAccountRequest' }
      responses:
        '201': { description: Подключён, первая синхронизация запланирована }
        '400': { description: Некорректный адрес/хост/TLS или проверка подключения не пройдена }
        '403': { description: Нет ADMIN_MAIL_POLICY }
        '409': { description: Ящик уже подключён либо достигнут лимит }
        '503': { description: Не настроен CORVEX_EXTERNAL_MAIL_ENC_KEY }
  /mail/external-accounts/test:
    post:
      summary: Проверить черновик подключения (ADMIN_MAIL_POLICY)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExternalMailAccountRequest' }
      responses:
        '200': { description: Отдельные результаты входящего подключения и SMTP-аутентификации }
  /mail/external-accounts/{accountId}:
    parameters: [{ name: accountId, in: path, required: true, schema: { type: string, format: uuid } }]
    get: { summary: Назначенный ящик и статус (владелец или ADMIN_MAIL_POLICY), responses: { '200': { description: Аккаунт без секрета }, '404': { description: Не найден или чужой } } }
    put:
      summary: Изменить внешний ящик (ADMIN_MAIL_POLICY); пустой secret сохраняет текущий пароль
      description: |
        Для OAuth-ящика `oauthConnectionId` заменяет токены после повторного входа, не трогая
        настройки, курсоры папок и журнал перенесённых писем. Тот же вызов переводит парольный
        ящик Gmail/Microsoft 365 на OAuth (`authType=OAUTH2` + `oauthConnectionId`): пароль
        удаляется, история переноса сохраняется. Без согласия переключиться на OAuth нельзя.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExternalMailAccountRequest' }
      responses: { '200': { description: Обновлён } }
    delete: { summary: Отключить внешний ящик (ADMIN_MAIL_POLICY); импортированные письма остаются, responses: { '204': { description: Отключён } } }
  /mail/external-accounts/{accountId}/test:
    post: { summary: Проверить сохранённое подключение (ADMIN_MAIL_POLICY), parameters: [{ name: accountId, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '200': { description: Результат проверки } } }
  /mail/external-accounts/{accountId}/sync:
    post: { summary: Запустить ручной сбор новых писем (ADMIN_MAIL_POLICY), parameters: [{ name: accountId, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '202': { description: Запуск принят }, '409': { description: Синхронизация уже выполняется или отключена } } }
  /mail/external-accounts/{accountId}/migrate:
    post: { summary: Импортировать архив всех папок (ADMIN_MAIL_POLICY), parameters: [{ name: accountId, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '202': { description: Миграция принята } } }
  /mail/external-accounts/{accountId}/reset-sync:
    post: { summary: Сбросить курсоры папок (ADMIN_MAIL_POLICY), parameters: [{ name: accountId, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '204': { description: Сброшено } } }
  /mail/external-accounts/{accountId}/enabled:
    patch:
      summary: Пауза/возобновление сбора или send-as (ADMIN_MAIL_POLICY)
      parameters: [{ name: accountId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: { enabled: { type: boolean }, syncEnabled: { type: boolean }, sendEnabled: { type: boolean } }
      responses: { '200': { description: Обновлённый аккаунт } }
  /mail/external-accounts/{accountId}/runs:
    get: { summary: Запуски синхронизации (владелец или ADMIN_MAIL_POLICY), parameters: [{ name: accountId, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '200': { description: История запусков } } }
  /mail/external-accounts/oauth/providers:
    get:
      summary: Доступные входы через провайдера (MAIL_READ_OWN) — включён ли каждый и почему нет
      responses:
        '200':
          description: Список провайдеров; enabled=false, если не заданы client id/secret или CORVEX_PUBLIC_BASE_URL
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ExternalMailOAuthProviderView' }
  /mail/external-accounts/oauth/authorize:
    post:
      summary: Начать вход через Google/Microsoft (MAIL_EXTERNAL_ACCOUNTS или ADMIN_MAIL_POLICY)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExternalMailOAuthAuthorizeRequest' }
      responses:
        '200':
          description: Одноразовый state и адрес страницы согласия; браузер переходит по нему
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExternalMailOAuthAuthorizeResponse' }
        '400': { description: Неизвестный провайдер или внешний адрес возврата }
        '403': { description: Нет права подключать внешние ящики }
        '503': { description: Провайдер не настроен (нет client id/secret или публичного адреса) }
  /mail/external-accounts/oauth/callback:
    get:
      summary: Возврат из Google/Microsoft (без JWT; доверие строится на одноразовом state)
      parameters:
        - { name: code, in: query, required: false, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
        - { name: error, in: query, required: false, schema: { type: string } }
      responses:
        '302':
          description: |
            Редирект в приложение: `?oauth=connected&connection=<uuid>&provider=GOOGLE|MICROSOFT&email=<адрес>`
            либо `?oauth=error&reason=invalid_state|state_expired|access_denied|no_code|exchange_failed`.
            Ящик на этом шаге не создаётся.
  /mail/external-accounts/oauth/connections/{connectionId}:
    get:
      summary: Итог согласия до создания ящика — адрес и срок (владелец или ADMIN_MAIL_POLICY)
      parameters: [{ name: connectionId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: Провайдер, адрес и срок подключения
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExternalMailOAuthConnectionView' }
        '403': { description: Подключение принадлежит другому пользователю }
        '404': { description: Подключение не найдено }
  /mail/external-accounts/{accountId}/audit:
    get: { summary: Аудит внешнего ящика без секретов (ADMIN_MAIL_POLICY), parameters: [{ name: accountId, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '200': { description: Аудит } } }
  /mail/rules:
    x-corvex-status: planned
    get: { summary: Правила автосортировки пользователя, responses: { '200': { description: Список по позиции } } }
    post: { summary: Создать правило (условия/действия JSON — см. схему mail_rules), responses: { '201': { description: Создано } } }
  /mail/contacts:
    get:
      summary: Личная адресная книга с поиском (MAIL_READ_OWN)
      description: |
        Контакты принадлежат владельцу из JWT subject. Администратор не имеет доступа
        к чужой книге. Поиск идёт по имени, адресу и организации без учёта регистра.
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Подстрока имени, адреса или организации }
        - { name: limit, in: query, schema: { type: integer, default: 500, maximum: 1000 } }
      responses:
        '200':
          description: Контакты, отсортированные по имени
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Contact' } } } }
        '403': { description: Нет права MAIL_READ_OWN }
    post:
      summary: Добавить контакт
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ContactInput' } } }
      responses:
        '201': { description: Контакт создан, content: { application/json: { schema: { $ref: '#/components/schemas/Contact' } } } }
        '400': { description: Некорректный адрес }
        '409': { description: Контакт с таким адресом уже есть или достигнут лимит 10 000 }
  /mail/contacts/{contactId}:
    put:
      summary: Изменить контакт
      parameters: [{ name: contactId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ContactInput' } } }
      responses:
        '200': { description: Сохранён }
        '404': { description: Контакт не найден или принадлежит другому пользователю }
        '409': { description: Адрес уже занят другим контактом }
    delete:
      summary: Удалить контакт
      parameters: [{ name: contactId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '204': { description: Удалён }
        '404': { description: Контакт не найден или принадлежит другому пользователю }
  /mail/contacts/import:
    post:
      summary: Импорт vCard или CSV
      description: |
        Принимает .vcf/.vcard или .csv/.tsv до 5 МиБ; кодировка определяется по BOM,
        затем строгим UTF-8, затем Windows-1251. Существующие адреса не перезаписываются:
        заполняются только пустые поля. Повторный импорт безопасен.
      parameters:
        - { name: format, in: query, schema: { type: string, enum: [AUTO, VCARD, CSV], default: AUTO } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: Итог импорта со счётчиками и строками, которые не удалось перенести
          content: { application/json: { schema: { $ref: '#/components/schemas/ContactImportResult' } } }
        '413': { description: Файл больше 5 МиБ }
  /mail/contacts/export:
    get:
      summary: Экспорт адресной книги
      parameters:
        - { name: format, in: query, schema: { type: string, enum: [vcf, csv], default: vcf } }
      responses:
        '200': { description: Файл vCard 3.0 или CSV с BOM для Excel }
        '403': { description: Нет права MAIL_READ_OWN }
  /mail/signatures:
    x-corvex-status: planned
    get: { summary: Подписи пользователя, responses: { '200': { description: Список } } }
    post: { summary: Создать подпись, responses: { '201': { description: Создана } } }
  /mail/vacation:
    x-corvex-status: planned
    get: { summary: Настройки автоответа (отпуск), responses: { '200': { description: Настройки } } }
    put: { summary: Включить/изменить автоответ, responses: { '200': { description: Сохранено } } }
  # --- Админский перенос: сводка, массовый CSV, квота ---------------------------
  /mail/admin/migrations:
    get:
      summary: Сводка переноса по сотрудникам (ADMIN_MAIL_POLICY)
      description: |
        Только те, у кого есть приглашение или задание. Показывает состояние
        приглашения, онбординга и задания, перенесённые письма, квоту и занятое место.
      responses:
        '200':
          description: Сводка; при недоступности auth-service квота и ФИО могут быть пустыми
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminMigrationSummary' } } }
        '403': { description: Нет права ADMIN_MAIL_POLICY }
  /mail/admin/migrations/bulk:
    post:
      summary: Массовое приглашение из CSV
      description: |
        Заголовок `email, source_host, source_login` (разделитель `,`, `;` или табуляция).
        Пароли в файле не принимаются: сотрудник вводит пароль приложения сам.
        Неизвестные адреса и повторы попадают в `issues`, остальные строки применяются.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: Итог разбора и число созданных приглашений
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminMigrationBulkResult' } } }
        '403': { description: Нет права ADMIN_MAIL_POLICY }
        '413': { description: Файл больше 1 МиБ }
  /mail/admin/migrations/{ownerId}/quota-bump:
    post:
      summary: Поднять квоту из отчёта о переносе
      parameters: [{ name: ownerId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                quotaBytes: { type: integer, format: int64, description: Новое значение квоты }
                addBytes: { type: integer, format: int64, description: Прибавка к текущей квоте }
      responses:
        '200':
          description: Новая квота и занятое место
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminMigrationQuotaResult' } } }
        '400': { description: Квота не указана или вне допустимого диапазона }
        '403': { description: Нет права ADMIN_MAIL_POLICY }
        '404': { description: Сотрудник не найден }
  # --- Онбординг после первого входа -------------------------------------------
  # Состояние персональное: администратор его не читает и не меняет.
  /onboarding:
    get:
      summary: Состояние предложения «Перенести почту»
      description: |
        `migrationSuggested` — показывать ли мастер. После «позже» остаётся true
        (напоминание баннером), после «мне нечего переносить» — false. После успешного
        задания состояние становится DONE и выводится из заданий, а не выставляется вручную.
      responses:
        '200':
          description: Состояние онбординга
          content: { application/json: { schema: { $ref: '#/components/schemas/OnboardingView' } } }
        '403': { description: Нет права MAIL_READ_OWN }
  /onboarding/migration/dismiss:
    post:
      summary: Отложить предложение переноса
      responses:
        '200':
          description: Состояние после решения
          content: { application/json: { schema: { $ref: '#/components/schemas/OnboardingView' } } }
        '403': { description: Нет права MAIL_READ_OWN }
  /onboarding/migration/not-needed:
    post:
      summary: Отметить «мне нечего переносить»
      responses:
        '200':
          description: Состояние после решения
          content: { application/json: { schema: { $ref: '#/components/schemas/OnboardingView' } } }
        '403': { description: Нет права MAIL_READ_OWN }
  /onboarding/migration/reset:
    post:
      summary: Вернуть предложение переноса
      responses:
        '200':
          description: Состояние снова PENDING
          content: { application/json: { schema: { $ref: '#/components/schemas/OnboardingView' } } }
        '409': { description: Перенос уже выполнялся }
  # --- Перенос почты из внешнего ящика -----------------------------------------
  # Задание — отдельная сущность, а не «ещё одна синхронизация»: у него есть план,
  # пауза, продолжение и отчёт. Перезапуск идемпотентен по SHA-256 письма.
  /mail/migration/preview:
    post:
      summary: Оценка объёма архива до запуска (MAIL_EXTERNAL_ACCOUNTS или ADMIN_MAIL_POLICY)
      description: |
        Открывает источник только на чтение. Размер папки оценивается по выборке до 50
        писем, точная сумма — если писем меньше. Показывает, помещается ли архив в квоту,
        и какие папки будут пропущены (All Mail, Important, Starred у Gmail).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MigrationScopeRequest' }
      responses:
        '200':
          description: План переноса
          content: { application/json: { schema: { $ref: '#/components/schemas/MigrationPreview' } } }
        '403': { description: Нет доступа к внешнему ящику }
        '502': { description: Источник недоступен, ошибка AUTH/TLS/NETWORK/PROTOCOL }
  /mail/migration:
    get:
      summary: Последние 20 заданий переноса пользователя
      responses:
        '200':
          description: Задания с папками и счётчиками
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/MigrationJob' } } } }
    post:
      summary: Создать задание переноса
      description: |
        Повторяет preview, сохраняет план и ставит задание в отдельную очередь
        `corvex-mail-migration`. Второе активное задание по тому же ящику отклоняется.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MigrationScopeRequest' }
      responses:
        '202':
          description: Задание принято
          content: { application/json: { schema: { $ref: '#/components/schemas/MigrationJob' } } }
        '403': { description: Нет доступа к внешнему ящику }
        '409': { description: По ящику уже есть активное задание или в источнике нет папок }
        '502': { description: Источник недоступен }
  /mail/migration/{jobId}:
    get:
      summary: Состояние задания
      parameters: [{ name: jobId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: Задание
          content: { application/json: { schema: { $ref: '#/components/schemas/MigrationJob' } } }
        '404': { description: Задание не найдено или принадлежит другому пользователю }
  /mail/migration/{jobId}/report:
    get:
      summary: Отчёт по папкам и остатку квоты
      parameters: [{ name: jobId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: Отчёт
          content: { application/json: { schema: { $ref: '#/components/schemas/MigrationReport' } } }
        '404': { description: Задание не найдено }
  /mail/migration/{jobId}/pause:
    post:
      summary: Приостановить перенос
      description: Текущее письмо дописывается, курсор папки сохраняется; продолжение не перечитывает архив.
      parameters: [{ name: jobId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Задание в статусе PAUSED, content: { application/json: { schema: { $ref: '#/components/schemas/MigrationJob' } } } }
        '404': { description: Задание не найдено }
        '409': { description: Задание не выполняется }
  /mail/migration/{jobId}/resume:
    post:
      summary: Продолжить приостановленное или неудавшееся задание
      parameters: [{ name: jobId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Задание снова в очереди, content: { application/json: { schema: { $ref: '#/components/schemas/MigrationJob' } } } }
        '404': { description: Задание не найдено }
        '409': { description: Задание нельзя продолжить или оно уже выполняется }
  /mail/migration/{jobId}/cancel:
    post:
      summary: Отменить перенос
      description: Уже перенесённые письма остаются; отмена необратима, для повтора нужно новое задание.
      parameters: [{ name: jobId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Задание в статусе CANCELLED, content: { application/json: { schema: { $ref: '#/components/schemas/MigrationJob' } } } }
        '404': { description: Задание не найдено }
  # --- Собственные домены (ADMIN_MAIL_POLICY) ---------------------------------
  # readiness вычисляется только из подтверждённого James и свежих DNS-проверок;
  # «домен добавлен» само по себе никогда не означает «приём работает».
  /mail/admin/domains:
    get:
      summary: Реестр доменов с состоянием James и готовностью
      responses:
        '200': { description: Список, Cache-Control no-store }
        '403': { description: Нет права ADMIN_MAIL_POLICY }
    post:
      summary: Зарегистрировать домен в реестре Corvex (в James не пишет)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties: { domain: { type: string, example: company.ru } }
      responses:
        '201': { description: Зарегистрирован }
        '400': { description: Некорректный домен }
        '409': { description: Домен уже добавлен }
  /mail/admin/domains/{domain}:
    get:
      summary: Домен, последние проверки и причины блокировки
      parameters: [{ name: domain, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Карточка домена }
        '404': { description: Домен не найден }
    delete:
      summary: Удалить только запись реестра (James и ящики не изменяются)
      parameters: [{ name: domain, in: path, required: true, schema: { type: string } }]
      responses:
        '204': { description: Удалено }
  /mail/admin/domains/{domain}/james:
    post:
      summary: Создать домен в James через mTLS-мост
      description: |
        200 — James подтвердил наличие домена (204 на PUT).
        202 — исход неизвестен (таймаут/неожиданный код): повторять запрос нельзя,
        состояние разрешается чтением GET /domains/{domain} в James.
        400 — James отклонил домен. 503 — мост не настроен.
      parameters: [{ name: domain, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Домен подтверждён }
        '202': { description: Исход неизвестен, домен не считается созданным }
        '400': { description: James отклонил домен }
        '409': { description: Домен отключён или запрос уже выполняется }
        '503': { description: Мост James WebAdmin не настроен }
  /mail/admin/domains/{domain}/verify:
    post:
      summary: Выполнить реальную DNS-проверку MX/SPF/DKIM/DMARC/autodiscover
      parameters: [{ name: domain, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Результаты сохранены, readiness пересчитан }
  /mail/admin/domains/{domain}/dns:
    get:
      summary: Точные DNS-записи для регистратора, включая p= действующего DKIM-ключа
      parameters: [{ name: domain, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: Записи MX/TXT/CNAME с пояснениями
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    type: { type: string, enum: [MX, TXT, CNAME] }
                    name: { type: string, example: '@' }
                    value: { type: string, nullable: true }
                    priority: { type: integer, nullable: true }
                    note: { type: string }
components:
  schemas:
    MailSearchResult:
      type: object
      required: [messageId]
      properties:
        messageId: { type: string, format: uuid }
        folderId: { type: string, format: uuid, nullable: true }
        uid: { type: integer, format: int64 }
        sender: { type: string }
        subject: { type: string }
        snippet: { type: string, description: 'Короткое превью тела (до 180 символов)' }
        internalDate: { type: string, format: date-time, nullable: true }

    DraftPayload:
      type: object
      description: |
        Вложения встраиваются в JSON как base64: до 10 файлов, до 3 МиБ каждый и до
        10 МиБ суммарно; тело и тема ограничены 500 000 байт UTF-8.
      properties:
        to: { type: string }
        cc: { type: string }
        subject: { type: string }
        bodyText: { type: string }
        bodyHtml: { type: string }
        externalAccountId: { type: string, format: uuid, nullable: true }
        attachments:
          type: array
          maxItems: 10
          items:
            type: object
            required: [fileName, contentBase64]
            properties:
              fileName: { type: string }
              contentType: { type: string }
              contentBase64: { type: string, format: byte }
    DraftView:
      type: object
      properties:
        id: { type: string, format: uuid }
        revision: { type: integer, format: int64 }
        payload: { $ref: '#/components/schemas/DraftPayload' }
        updatedAt: { type: string, format: date-time }
    DraftSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        revision: { type: integer, format: int64 }
        to: { type: string }
        subject: { type: string }
        attachmentCount: { type: integer }
        sizeBytes: { type: integer, format: int64 }
        updatedAt: { type: string, format: date-time }
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    AdminMigrationRow:
      type: object
      properties:
        ownerId: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        invitationStatus: { type: string, nullable: true, enum: [PENDING, STARTED, DONE, DISMISSED] }
        migrationState: { type: string, nullable: true, enum: [PENDING, DISMISSED, NOT_NEEDED, DONE] }
        jobStatus: { type: string, nullable: true, enum: [QUEUED, RUNNING, PAUSED, DONE, PARTIAL, FAILED, CANCELLED] }
        jobId: { type: string, format: uuid, nullable: true }
        migratedMessages: { type: integer }
        quotaBytes: { type: integer, format: int64 }
        usedBytes: { type: integer, format: int64 }
        sourceHost: { type: string, nullable: true }
        sourceLogin: { type: string, nullable: true }
    AdminMigrationTotals:
      type: object
      properties:
        employees: { type: integer }
        invited: { type: integer }
        notStarted: { type: integer }
        running: { type: integer }
        done: { type: integer }
        failed: { type: integer }
        migratedMessages: { type: integer, format: int64 }
    AdminMigrationSummary:
      type: object
      properties:
        rows:
          type: array
          items: { $ref: '#/components/schemas/AdminMigrationRow' }
        totals: { $ref: '#/components/schemas/AdminMigrationTotals' }
        notes: { type: array, items: { type: string } }
    AdminMigrationBulkResult:
      type: object
      properties:
        rows: { type: integer }
        invited: { type: integer }
        skipped: { type: integer }
        truncated: { type: boolean, description: Обработаны первые 1000 строк }
        issues:
          type: array
          items:
            type: object
            properties:
              line: { type: integer }
              value: { type: string }
              reason: { type: string }
    AdminMigrationQuotaResult:
      type: object
      properties:
        ownerId: { type: string, format: uuid }
        quotaBytes: { type: integer, format: int64 }
        usedBytes: { type: integer, format: int64 }
        fits: { type: boolean }
        remainingBytes: { type: integer, format: int64 }
    OnboardingAccountRef:
      type: object
      properties:
        id: { type: string, format: uuid }
        emailAddress: { type: string, format: email }
        provider: { type: string }
    OnboardingView:
      type: object
      properties:
        migrationState: { type: string, enum: [PENDING, DISMISSED, NOT_NEEDED, DONE] }
        migrationSuggested: { type: boolean }
        activeJobId: { type: string, format: uuid, nullable: true }
        lastJobStatus: { type: string, nullable: true }
        dismissedAt: { type: string, format: date-time, nullable: true }
        accounts:
          type: array
          items: { $ref: '#/components/schemas/OnboardingAccountRef' }
        suggestedEmail: { type: string, nullable: true, description: Адрес из админского CSV }
        suggestedSourceHost: { type: string, nullable: true }
        suggestedSourceLogin: { type: string, nullable: true }
    MigrationScopeRequest:
      type: object
      required: [accountId]
      properties:
        accountId: { type: string, format: uuid, description: Подключённый внешний ящик }
        includeAllMail: { type: boolean, default: false, description: 'Переносить All Mail, Important и Starred у Gmail' }
        skipFolders:
          type: array
          description: Папки, которые пользователь исключил вручную
          items: { type: string }
    MigrationFolderEstimate:
      type: object
      properties:
        remoteFolder: { type: string }
        specialUse: { type: string, nullable: true }
        messageCount: { type: integer }
        estimatedBytes: { type: integer, format: int64 }
    MigrationPreview:
      type: object
      properties:
        accountId: { type: string, format: uuid }
        includeAllMail: { type: boolean }
        folders:
          type: array
          items: { $ref: '#/components/schemas/MigrationFolderEstimate' }
        skippedFolders: { type: array, items: { type: string } }
        totalMessages: { type: integer, format: int64 }
        totalBytes: { type: integer, format: int64, description: Оценка по выборке до 50 писем на папку }
        quotaBytes: { type: integer, format: int64, description: '0 — без лимита или квота недоступна' }
        usedBytes: { type: integer, format: int64 }
        fits: { type: boolean }
        warnings: { type: array, items: { type: string } }
    MigrationFolder:
      type: object
      properties:
        id: { type: string, format: uuid }
        remoteFolder: { type: string }
        specialUse: { type: string, nullable: true }
        state: { type: string, enum: [PENDING, RUNNING, DONE, SKIPPED, FAILED] }
        estimatedMessages: { type: integer }
        estimatedBytes: { type: integer, format: int64 }
        migratedMessages: { type: integer }
        skippedMessages: { type: integer }
        error: { type: string, nullable: true }
    MigrationJob:
      type: object
      properties:
        id: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        accountEmail: { type: string, format: email }
        status: { type: string, enum: [QUEUED, RUNNING, PAUSED, DONE, PARTIAL, FAILED, CANCELLED] }
        mode: { type: string, enum: [FULL, DELTA] }
        includeAllMail: { type: boolean }
        estimatedMessages: { type: integer, format: int64 }
        estimatedBytes: { type: integer, format: int64 }
        migratedMessages: { type: integer }
        skippedMessages: { type: integer }
        error: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }
        folders:
          type: array
          items: { $ref: '#/components/schemas/MigrationFolder' }
    MigrationReport:
      type: object
      properties:
        job: { $ref: '#/components/schemas/MigrationJob' }
        quotaBytes: { type: integer, format: int64 }
        usedBytes: { type: integer, format: int64 }
        remainingBytes: { type: integer, format: int64, description: '−1 — квота неизвестна' }
        notes: { type: array, items: { type: string } }
    Contact:
      type: object
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string, maxLength: 256 }
        email: { type: string, format: email }
        phone: { type: string, nullable: true, maxLength: 64 }
        organization: { type: string, nullable: true, maxLength: 256 }
        jobTitle: { type: string, nullable: true, maxLength: 256 }
        note: { type: string, nullable: true, maxLength: 4000 }
        groupName: { type: string, nullable: true, maxLength: 128 }
        source: { type: string, enum: [MANUAL, VCARD, CSV] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ContactInput:
      type: object
      required: [email]
      properties:
        displayName: { type: string, maxLength: 256, description: 'Пусто — берётся часть адреса до @' }
        email: { type: string, format: email }
        phone: { type: string, maxLength: 64 }
        organization: { type: string, maxLength: 256 }
        jobTitle: { type: string, maxLength: 256 }
        note: { type: string, maxLength: 4000 }
        groupName: { type: string, maxLength: 128 }
    ContactImportResult:
      type: object
      properties:
        total: { type: integer }
        created: { type: integer }
        updated: { type: integer }
        skipped: { type: integer }
        truncated: { type: boolean, description: 'Достигнут лимит адресной книги: остаток файла не обработан' }
        issues:
          type: array
          items:
            type: object
            properties:
              line: { type: integer }
              value: { type: string }
              reason: { type: string }
    ExternalMailPreset:
      type: object
      properties:
        provider: { type: string, enum: [MAIL_RU, YANDEX, GMAIL, OUTLOOK] }
        imapHost: { type: string }
        imapPort: { type: integer }
        pop3Host: { type: string }
        pop3Port: { type: integer }
        smtpHost: { type: string }
        smtpPort: { type: integer }
        incomingSecurity: { $ref: '#/components/schemas/ExternalMailSecurity' }
        smtpSecurity: { $ref: '#/components/schemas/ExternalMailSecurity' }
        hint: { type: string }
    ExternalMailSecurity:
      type: string
      enum: [SSL_TLS, STARTTLS, PLAIN]
    ExternalMailOwner:
      type: object
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        email: { type: string, format: email }
        displayName: { type: string }
        department: { type: string, nullable: true }
        status: { type: string }
        externalAccountCount: { type: integer, format: int64 }
    ExternalMailTargetFolder:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        specialUse: { type: string, nullable: true }
        parentId: { type: string, format: uuid, nullable: true }
        path: { type: string }
    ExternalMailAccountRequest:
      type: object
      properties:
        existingAccountId: { type: string, format: uuid, nullable: true }
        targetUserId: { type: string, format: uuid, nullable: true }
        ownerKind: { type: string, enum: [PERSONAL, SHARED_MAILBOX] }
        label: { type: string }
        emailAddress: { type: string, format: email }
        displayName: { type: string, nullable: true }
        provider: { type: string, enum: [MAIL_RU, YANDEX, GMAIL, OUTLOOK, CUSTOM] }
        authType: { type: string, enum: [APP_PASSWORD, PASSWORD, OAUTH2], description: "OAUTH2 — только Gmail и Microsoft 365 по IMAP; тогда секрет не передаётся" }
        incomingProtocol: { type: string, enum: [IMAP, POP3] }
        incomingHost: { type: string }
        incomingPort: { type: integer, minimum: 1, maximum: 65535 }
        incomingSecurity: { $ref: '#/components/schemas/ExternalMailSecurity' }
        incomingUsername: { type: string }
        secret: { type: string, writeOnly: true, description: "Пароль приложения; никогда не возвращается API" }
        smtpEnabled: { type: boolean }
        smtpHost: { type: string, nullable: true }
        smtpPort: { type: integer, nullable: true, minimum: 1, maximum: 65535 }
        smtpSecurity: { $ref: '#/components/schemas/ExternalMailSecurity' }
        smtpUsername: { type: string, nullable: true }
        targetFolderId: { type: string, format: uuid, nullable: true }
        enabled: { type: boolean }
        syncEnabled: { type: boolean }
        sendEnabled: { type: boolean }
        initialSyncMode: { type: string, enum: [NEW_ONLY, IMPORT_ALL] }
        syncScope: { type: string, enum: [INBOX_ONLY, ALL_FOLDERS] }
        pollIntervalSeconds: { type: integer, minimum: 60, maximum: 86400 }
        leaveOnServer: { type: boolean }
        markSeenOnServer: { type: boolean }
        deleteAfterFetch: { type: boolean }
        saveSentOnServer: { type: boolean }
        sentFolderName: { type: string, nullable: true }
        testBeforeSave: { type: boolean }
        oauthConnectionId: { type: string, format: uuid, nullable: true, description: "Обязательно при authType=OAUTH2: id согласия из callback" }
    ExternalMailOAuthProviderView:
      type: object
      properties:
        provider: { type: string, enum: [GOOGLE, MICROSOFT] }
        title: { type: string, example: Microsoft 365 }
        enabled: { type: boolean }
        hint: { type: string }
    ExternalMailOAuthAuthorizeRequest:
      type: object
      required: [provider]
      properties:
        provider: { type: string, enum: [GOOGLE, MICROSOFT] }
        targetUserId: { type: string, format: uuid, nullable: true, description: "Заполняет администратор для сотрудника" }
        returnPath: { type: string, example: /mail, description: "Локальный путь без хоста; по умолчанию /mail" }
    ExternalMailOAuthAuthorizeResponse:
      type: object
      properties:
        authorizationUrl: { type: string, format: uri }
        state: { type: string }
        expiresAt: { type: string, format: date-time }
    ExternalMailOAuthConnectionView:
      type: object
      properties:
        id: { type: string, format: uuid }
        provider: { type: string, enum: [GOOGLE, MICROSOFT] }
        email: { type: string, format: email }
        expiresAt: { type: string, format: date-time }
    ExternalMailAccount:
      allOf:
        - $ref: '#/components/schemas/ExternalMailAccountRequest'
        - type: object
          properties:
            id: { type: string, format: uuid }
            ownerId: { type: string, format: uuid }
            secretConfigured: { type: boolean }
            lastSyncAt: { type: string, format: date-time, nullable: true }
            lastSuccessAt: { type: string, format: date-time, nullable: true }
            nextSyncAt: { type: string, format: date-time, nullable: true }
            lastError: { type: string, nullable: true }
            consecutiveFailures: { type: integer }
            syncRunning: { type: boolean }
            queuedCount: { type: integer, format: int64 }
            deliveredCount: { type: integer, format: int64 }
            failedCount: { type: integer, format: int64 }
            reauthRequired: { type: boolean, description: "Согласие Google/Microsoft отозвано: нужен повторный вход" }
    MessageSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        folderId: { type: string, format: uuid }
        sender: { type: string }
        subject: { type: string }
        snippet: { type: string }
        internalDate: { type: string, format: date-time }
        sizeBytes: { type: integer, format: int64 }
        seen: { type: boolean }
        flagged: { type: boolean }
        hasAttachments: { type: boolean }
        spamScore: { type: number, nullable: true }
    MailDomainView:
      type: object
      properties:
        id: { type: string, format: uuid }
        domain: { type: string }
        enabled: { type: boolean }
        jamesState: { type: string, enum: [NOT_REQUESTED, REQUESTING, CREATED, FAILED, UNCERTAIN] }
        jamesConfirmedAt: { type: string, format: date-time, nullable: true }
        jamesBridgeAvailable: { type: boolean }
        acceptanceEnabled: { type: boolean, description: Домен принимается сервером }
        acceptanceSource:
          type: string
          enum: [STATIC, DYNAMIC, ABSENT, UNAVAILABLE]
          description: |
            STATIC — домен в CORVEX_MAIL_DOMAINS, DYNAMIC — подтверждён в James и
            включён в реестре, ABSENT — не принимается, UNAVAILABLE — реестр
            недоступен, поэтому подтвердить приём нельзя (это не «домен чужой»).
            DYNAMIC сохраняется и во время аварии реестра: домен из последнего
            успешного снимка продолжает приниматься, пока SMTP отвечает 451 на
            домены, которых в этом снимке не было.
        dnsChecked: { type: boolean }
        checkedAt: { type: string, format: date-time, nullable: true }
        fresh: { type: boolean, description: Проверка не старше corvex.domains.max-check-age-seconds }
        receivingReady: { type: boolean }
        sendingReady: { type: boolean }
        blockedReason: { type: string, nullable: true }
        checks:
          type: array
          items:
            type: object
            properties:
              name: { type: string, enum: [MX, SPF, DKIM, DMARC, AUTODISCOVER] }
              state: { type: string, enum: [PASS, WARN, FAIL, UNKNOWN] }
              detail: { type: string }
              observedAt: { type: string, format: date-time }
    MessageDetail:
      allOf:
        - $ref: '#/components/schemas/MessageSummary'
        - type: object
          properties:
            to: { type: array, items: { type: string } }
            cc: { type: array, items: { type: string } }
            sanitizedHtml: { type: string }
            textBody: { type: string }
            attachments:
              type: array
              items:
                type: object
                properties: { partIndex: { type: integer }, fileName: { type: string }, sizeBytes: { type: integer, format: int64 }, contentType: { type: string }, avStatus: { type: string } }
security:
  - bearerAuth: []
