openapi: 3.0.3
info:
  title: Corvex Mail API
  version: 1.0.0
  description: |
    REST API веб-клиента почты поверх mail-storage-service (отправка уходит в mail-smtp-service через RabbitMQ).
    Внешние клиенты ходят не сюда, а по IMAP/POP3/SMTP. Списки — курсорная пагинация, тела писем отдаются
    санитизированным HTML (XSS) + plain text.
servers:
  - url: https://mail.company.local/api/v1
paths:
  /mail/folders:
    get:
      summary: Дерево папок текущего пользователя со счётчиками непрочитанных
      responses:
        '200':
          description: Папки
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    parentId: { type: string, format: uuid, nullable: true }
                    name: { type: string }
                    specialUse: { type: string, enum: [INBOX, SENT, DRAFTS, TRASH, SPAM, ARCHIVE], nullable: true }
                    unreadCount: { type: integer }
                    totalCount: { type: integer }
    post:
      summary: Создать папку (MAIL_MANAGE_FOLDERS)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties: { name: { type: string }, parentId: { type: string, format: uuid, nullable: true } }
      responses: { '201': { description: Создана }, '409': { description: Имя занято в этом родителе } }
  /mail/folders/{folderId}:
    patch:
      summary: Переименовать/переместить папку (системные переименовывать нельзя)
      parameters: [{ name: folderId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Обновлена } }
    delete:
      summary: Удалить папку (письма — в Корзину)
      parameters: [{ name: folderId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '204': { description: Удалена } }
  /mail/folders/{folderId}/messages:
    get:
      summary: Список писем папки (курсор по internalDate+id, только метаданные и сниппет)
      parameters:
        - { name: folderId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: sort, in: query, schema: { type: string, enum: [dateDesc, dateAsc], default: dateDesc } }
      responses:
        '200':
          description: Страница писем
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/MessageSummary' } }
                  nextCursor: { type: string, nullable: true }
  /mail/messages/{messageId}:
    get:
      summary: Полное письмо — заголовки, санитизированный HTML, plain text, список вложений
      parameters: [{ name: messageId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Письмо, content: { application/json: { schema: { $ref: '#/components/schemas/MessageDetail' } } } }
    delete:
      summary: В Корзину; из Корзины — окончательно
      parameters: [{ name: messageId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '204': { description: Готово } }
  /mail/messages/{messageId}/flags:
    patch:
      summary: Изменить флаги (seen/flagged) — синхронизируется с IMAP-состоянием
      parameters: [{ name: messageId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: { seen: { type: boolean }, flagged: { type: boolean } }
      responses: { '200': { description: Флаги обновлены } }
  /mail/messages/bulk-move:
    post:
      summary: Пакетное перемещение писем в папку
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messageIds, targetFolderId]
              properties:
                messageIds: { type: array, items: { type: string, format: uuid }, maxItems: 1000 }
                targetFolderId: { type: string, format: uuid }
      responses: { '202': { description: Принято к выполнению (асинхронно при больших объёмах) } }
  /mail/messages/send:
    post:
      summary: Отправить письмо (MAIL_SEND_INTERNAL / MAIL_SEND_EXTERNAL проверяются по доменам получателей)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, subject]
              properties:
                to: { type: array, items: { type: string, format: email } }
                cc: { type: array, items: { type: string, format: email } }
                bcc: { type: array, items: { type: string, format: email } }
                subject: { type: string }
                htmlBody: { type: string }
                textBody: { type: string }
                signatureId: { type: string, format: uuid, nullable: true }
                externalAccountId: { type: string, format: uuid, nullable: true, description: "Подключённый внешний ящик для send-as через SMTP провайдера; null — адрес Corvex" }
                attachmentIds: { type: array, items: { type: string } }
                inReplyTo: { type: string, nullable: true }
      responses:
        '202': { description: Поставлено в очередь отправки, копия сохранена в Отправленных }
        '403': { description: Нет права на внешнюю отправку }
        '413': { description: Превышен лимит размера письма }
        '507': { description: Превышена дисковая квота отправителя }
  /mail/drafts:
    post:
      summary: Создать/обновить черновик (автосохранение редактора)
      responses: { '201': { description: Черновик сохранён } }
  /mail/attachments:
    post:
      summary: Загрузить вложение до отправки (потоково, AV-сканирование до публикации)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { type: object, properties: { file: { type: string, format: binary } } }
      responses:
        '201':
          description: Загружено
          content:
            application/json:
              schema: { type: object, properties: { sha256: { type: string }, sizeBytes: { type: integer, format: int64 }, avStatus: { type: string, enum: [PENDING, CLEAN, INFECTED, ERROR] } } }
  /mail/messages/{messageId}/attachments/{partIndex}:
    get:
      summary: Скачать вложение (403 при avStatus=INFECTED/ERROR)
      parameters:
        - { name: messageId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: partIndex, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Файл, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        '403': { description: Вложение заблокировано антивирусом }
  /mail/search:
    get:
      summary: Полнотекстовый поиск (Elasticsearch — тема, отправитель, получатель, тело, имена/текст вложений)
      parameters:
        - { name: q, in: query, required: true, schema: { type: string }, example: 'from:buhgalteria счёт has:attachment after:2026-01-01' }
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
      responses:
        '200': { description: Результаты с подсветкой, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/MessageSummary' } }, tookMs: { type: integer } } } } } }
  /mail/external-accounts/presets:
    get:
      summary: Пресеты Mail.ru, Яндекс, Gmail и Outlook для формы подключения внешнего ящика
      responses:
        '200':
          description: Пресеты
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ExternalMailPreset' }
  /mail/external-accounts/owners:
    get:
      summary: Поиск активных сотрудников для подключения им внешних ящиков (ADMIN_MAIL_POLICY)
      parameters:
        - { name: q, in: query, required: false, schema: { type: string }, description: 'Имя, email, логин или отдел' }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 25, minimum: 1, maximum: 50 } }
      responses:
        '200':
          description: Сотрудники и количество уже подключённых внешних ящиков
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ExternalMailOwner' }
        '403': { description: Нет ADMIN_MAIL_POLICY }
  /mail/external-accounts/owners/{ownerId}:
    get:
      summary: Владелец внешнего ящика (сам сотрудник или ADMIN_MAIL_POLICY)
      parameters: [{ name: ownerId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Профиль владельца и счётчик внешних ящиков }
        '400': { description: Пользователь не найден }
        '403': { description: Чужой владелец без ADMIN_MAIL_POLICY }
  /mail/external-accounts/owners/{ownerId}/folders:
    get:
      summary: Папки выбранного владельца для целевого размещения собранной почты
      parameters: [{ name: ownerId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: Папки владельца, включая полный путь вложенных папок
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ExternalMailTargetFolder' }
        '400': { description: Пользователь не найден }
        '403': { description: Чужой владелец без ADMIN_MAIL_POLICY }
  /mail/external-accounts:
    get:
      summary: Внешние ящики владельца (MAIL_EXTERNAL_ACCOUNTS; ADMIN_MAIL_POLICY может указать ownerId)
      parameters:
        - { name: ownerId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Подключённые ящики без секретов
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ExternalMailAccount' }
    post:
      summary: Подключить внешний ящик; пароль приложения сохраняется только AES-256-GCM шифртекстом
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExternalMailAccountRequest' }
      responses:
        '201': { description: Подключён, первая синхронизация запланирована }
        '400': { description: Некорректный адрес/хост/TLS или проверка подключения не пройдена }
        '403': { description: Нет MAIL_EXTERNAL_ACCOUNTS }
        '409': { description: Ящик уже подключён либо достигнут лимит }
        '503': { description: Не настроен CORVEX_EXTERNAL_MAIL_ENC_KEY }
  /mail/external-accounts/test:
    post:
      summary: Проверить IMAP/POP3 и SMTP по черновику формы без сохранения
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExternalMailAccountRequest' }
      responses:
        '200': { description: Отдельные результаты входящего подключения и SMTP-аутентификации }
  /mail/external-accounts/{accountId}:
    parameters: [{ name: accountId, in: path, required: true, schema: { type: string, format: uuid } }]
    get: { summary: Один внешний ящик и его статус, responses: { '200': { description: Аккаунт без секрета }, '404': { description: Не найден или чужой } } }
    put:
      summary: Изменить внешний ящик; пустой secret сохраняет текущий пароль
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExternalMailAccountRequest' }
      responses: { '200': { description: Обновлён } }
    delete: { summary: Отключить внешний ящик; импортированные письма остаются, responses: { '204': { description: Отключён } } }
  /mail/external-accounts/{accountId}/test:
    post: { summary: Проверить сохранённое подключение, parameters: [{ name: accountId, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '200': { description: Результат проверки } } }
  /mail/external-accounts/{accountId}/sync:
    post: { summary: Запустить ручной сбор новых писем, parameters: [{ name: accountId, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '202': { description: Запуск принят }, '409': { description: Синхронизация уже выполняется или отключена } } }
  /mail/external-accounts/{accountId}/migrate:
    post: { summary: Импортировать архив всех папок с дедупликацией, parameters: [{ name: accountId, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '202': { description: Миграция принята } } }
  /mail/external-accounts/{accountId}/reset-sync:
    post: { summary: Сбросить курсоры папок, сохранив дедупликацию, parameters: [{ name: accountId, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '204': { description: Сброшено } } }
  /mail/external-accounts/{accountId}/enabled:
    patch:
      summary: Пауза/возобновление сбора или send-as
      parameters: [{ name: accountId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: { enabled: { type: boolean }, syncEnabled: { type: boolean }, sendEnabled: { type: boolean } }
      responses: { '200': { description: Обновлённый аккаунт } }
  /mail/external-accounts/{accountId}/runs:
    get: { summary: Последние запуски синхронизации/миграции, parameters: [{ name: accountId, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '200': { description: История запусков } } }
  /mail/external-accounts/{accountId}/audit:
    get: { summary: Аудит действий с внешним ящиком без секретов, parameters: [{ name: accountId, in: path, required: true, schema: { type: string, format: uuid } }], responses: { '200': { description: Аудит } } }
  /mail/rules:
    get: { summary: Правила автосортировки пользователя, responses: { '200': { description: Список по позиции } } }
    post: { summary: Создать правило (условия/действия JSON — см. схему mail_rules), responses: { '201': { description: Создано } } }
  /mail/contacts:
    get: { summary: Адресная книга с группами, responses: { '200': { description: Контакты } } }
    post: { summary: Добавить контакт, responses: { '201': { description: Добавлен } } }
  /mail/signatures:
    get: { summary: Подписи пользователя, responses: { '200': { description: Список } } }
    post: { summary: Создать подпись, responses: { '201': { description: Создана } } }
  /mail/vacation:
    get: { summary: Настройки автоответа (отпуск), responses: { '200': { description: Настройки } } }
    put: { summary: Включить/изменить автоответ, responses: { '200': { description: Сохранено } } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    ExternalMailPreset:
      type: object
      properties:
        provider: { type: string, enum: [MAIL_RU, YANDEX, GMAIL, OUTLOOK] }
        imapHost: { type: string }
        imapPort: { type: integer }
        pop3Host: { type: string }
        pop3Port: { type: integer }
        smtpHost: { type: string }
        smtpPort: { type: integer }
        incomingSecurity: { $ref: '#/components/schemas/ExternalMailSecurity' }
        smtpSecurity: { $ref: '#/components/schemas/ExternalMailSecurity' }
        hint: { type: string }
    ExternalMailSecurity:
      type: string
      enum: [SSL_TLS, STARTTLS, PLAIN]
    ExternalMailOwner:
      type: object
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        email: { type: string, format: email }
        displayName: { type: string }
        department: { type: string, nullable: true }
        status: { type: string }
        externalAccountCount: { type: integer, format: int64 }
    ExternalMailTargetFolder:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        specialUse: { type: string, nullable: true }
        parentId: { type: string, format: uuid, nullable: true }
        path: { type: string }
    ExternalMailAccountRequest:
      type: object
      properties:
        existingAccountId: { type: string, format: uuid, nullable: true }
        targetUserId: { type: string, format: uuid, nullable: true }
        ownerKind: { type: string, enum: [PERSONAL, SHARED_MAILBOX] }
        label: { type: string }
        emailAddress: { type: string, format: email }
        displayName: { type: string, nullable: true }
        provider: { type: string, enum: [MAIL_RU, YANDEX, GMAIL, OUTLOOK, CUSTOM] }
        authType: { type: string, enum: [APP_PASSWORD, PASSWORD] }
        incomingProtocol: { type: string, enum: [IMAP, POP3] }
        incomingHost: { type: string }
        incomingPort: { type: integer, minimum: 1, maximum: 65535 }
        incomingSecurity: { $ref: '#/components/schemas/ExternalMailSecurity' }
        incomingUsername: { type: string }
        secret: { type: string, writeOnly: true, description: "Пароль приложения; никогда не возвращается API" }
        smtpEnabled: { type: boolean }
        smtpHost: { type: string, nullable: true }
        smtpPort: { type: integer, nullable: true, minimum: 1, maximum: 65535 }
        smtpSecurity: { $ref: '#/components/schemas/ExternalMailSecurity' }
        smtpUsername: { type: string, nullable: true }
        targetFolderId: { type: string, format: uuid, nullable: true }
        enabled: { type: boolean }
        syncEnabled: { type: boolean }
        sendEnabled: { type: boolean }
        initialSyncMode: { type: string, enum: [NEW_ONLY, IMPORT_ALL] }
        syncScope: { type: string, enum: [INBOX_ONLY, ALL_FOLDERS] }
        pollIntervalSeconds: { type: integer, minimum: 60, maximum: 86400 }
        leaveOnServer: { type: boolean }
        markSeenOnServer: { type: boolean }
        deleteAfterFetch: { type: boolean }
        saveSentOnServer: { type: boolean }
        sentFolderName: { type: string, nullable: true }
        testBeforeSave: { type: boolean }
    ExternalMailAccount:
      allOf:
        - $ref: '#/components/schemas/ExternalMailAccountRequest'
        - type: object
          properties:
            id: { type: string, format: uuid }
            ownerId: { type: string, format: uuid }
            secretConfigured: { type: boolean }
            lastSyncAt: { type: string, format: date-time, nullable: true }
            lastSuccessAt: { type: string, format: date-time, nullable: true }
            nextSyncAt: { type: string, format: date-time, nullable: true }
            lastError: { type: string, nullable: true }
            consecutiveFailures: { type: integer }
            syncRunning: { type: boolean }
            queuedCount: { type: integer, format: int64 }
            deliveredCount: { type: integer, format: int64 }
            failedCount: { type: integer, format: int64 }
    MessageSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        folderId: { type: string, format: uuid }
        sender: { type: string }
        subject: { type: string }
        snippet: { type: string }
        internalDate: { type: string, format: date-time }
        sizeBytes: { type: integer, format: int64 }
        seen: { type: boolean }
        flagged: { type: boolean }
        hasAttachments: { type: boolean }
        spamScore: { type: number, nullable: true }
    MessageDetail:
      allOf:
        - $ref: '#/components/schemas/MessageSummary'
        - type: object
          properties:
            to: { type: array, items: { type: string } }
            cc: { type: array, items: { type: string } }
            sanitizedHtml: { type: string }
            textBody: { type: string }
            attachments:
              type: array
              items:
                type: object
                properties: { partIndex: { type: integer }, fileName: { type: string }, sizeBytes: { type: integer, format: int64 }, contentType: { type: string }, avStatus: { type: string } }
security:
  - bearerAuth: []
