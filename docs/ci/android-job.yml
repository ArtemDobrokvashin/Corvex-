# Android-джоба для CI. Шаблон: положить в `.github/workflows/ci.yml` руками,
# в раздел `jobs:`, на том же уровне, что `java`, `frontend` и `python`.
#
# Почему шаблон, а не готовый файл: у автоматизации нет права `workflows`, поэтому
# файлы в `.github/workflows/` она пушить не может (так же лежит `e2e-job.yml`).
#
# ВАЖНО: джоба не заработает, пока в репозитории нет Gradle wrapper — `gradlew`,
# `gradlew.bat` и `gradle/wrapper/gradle-wrapper.jar`. Сейчас есть только
# `gradle-wrapper.properties`. Первая команда ниже упадёт с `gradlew: not found`,
# и это будет правильный сигнал, а не ложная зелёная галочка.
#
# Как положить wrapper в проект (на машине с Android Studio или с интернетом):
#   cd android
#   gradle wrapper --gradle-version 8.10.2 --distribution-type bin
#   git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar
#   git commit -m "android: gradle wrapper"
# После этого джоба станет осмысленной.

  android:
    name: Android / assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Кэш Gradle: первая сборка тянет Android Gradle Plugin, Compose и Hilt.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      # APK полезен для ручной приёмки на телефоне, но не является доказательством
      # того, что приложение запускается: это отдельный шаг с эмулятором.
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: corvex-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error
