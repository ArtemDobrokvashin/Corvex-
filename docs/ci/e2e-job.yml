# Джоба приёмки интерфейса для .github/workflows/ci.yml (P3-4).
#
# Почему это отдельный файл, а не прямо в ci.yml: у автоматизации, которая
# ведёт эту ветку, нет права `workflows`, и GitHub отклоняет push, если файл
# `.github/workflows/*` меняется. Вставить джобу нужно один раз вручную:
#
#   откройте .github/workflows/ci.yml и добавьте блок ниже на уровень джоб
#   (рядом с `java:`, `frontend:`, `python:`), затем закоммитьте.
#
# Сами проверки уже лежат в репозитории и работают без этой правки:
# `frontend/playwright.config.ts` и `frontend/e2e/mail.spec.ts`,
# запуск — `npm run e2e` из каталога `frontend`.
#
# Что проверяется и почему именно это:
#   * ширины 1280/1366/1440 — на ноутбуке 1366 px исчезали кнопки ответа,
#     пересылки, архива и спама (UX-BACKLOG P1-4);
#   * клавиатура (Tab, стрелки, Enter) — список был недоступен без мыши (P1-5);
#   * 200 % масштаб — та же вёрстка на уменьшенном CSS-вьюпорте;
#   * `en` — ни одной кнопки без подписи и aria-label.
#
# jsdom этого не видит: он не считает layout, поэтому дефекты дожили до
# пользователя.

  e2e:
    name: Interface / Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        run: npm ci

      # Браузер ставится отдельным шагом: если он не скачался, это видно в логе,
      # а не выглядит как «все e2e прошли».
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build the production bundle
        run: npm run build

      - name: Playwright acceptance
        run: npm run e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
          if-no-files-found: ignore
