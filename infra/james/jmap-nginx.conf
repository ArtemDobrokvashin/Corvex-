# Restricted internal TLS terminator for JMAP reads. No access logs or public port.
# JWT tokens remain full-account credentials; isolation and RBAC are still required.
user nginx;
worker_processes 1;
events { worker_connections 256; }
http {
    access_log off;
    server_tokens off;
    client_max_body_size 256k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 15s;
    server {
        listen 8443 ssl;
        server_name james-jmap;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_certificate /run/james-tls/jmap.crt;
        ssl_certificate_key /run/james-tls/jmap.key;
        location = /jmap/session {
            limit_except GET { deny all; }
            proxy_pass http://james:80;
            proxy_http_version 1.1;
            proxy_set_header Host james;
            proxy_connect_timeout 3s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }
        location = /jmap {
            limit_except POST { deny all; }
            proxy_pass http://james:80;
            proxy_http_version 1.1;
            proxy_set_header Host james;
            proxy_connect_timeout 3s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }
        location / { return 404; }
    }
}
