# Dedicated, opt-in mTLS bridge to the otherwise isolated James WebAdmin.
# No public port. Only generated local account creation is forwarded.
user nginx;
worker_processes 1;
events { worker_connections 128; }
http {
    access_log off;
    server_tokens off;
    client_max_body_size 4k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 15s;
    server {
        listen 8443 ssl;
        server_name james-admin;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_certificate /run/james-provision/admin.crt;
        ssl_certificate_key /run/james-provision/admin.key;
        ssl_client_certificate /run/james-provision/client-ca.crt;
        ssl_verify_client on;
        location ~ "^/users/cvx-[0-9a-f]{32}@localhost$" {
            # No query, encoding or alternate raw URI: `force` upserts and
            # James' sensitive-body logger must see the canonical /users path.
            if ($args != "") { return 400; }
            if ($request_uri !~ "^/users/cvx-[0-9a-f]{32}@localhost$") { return 400; }
            limit_except PUT { deny all; }
            proxy_pass http://james:8000;
            proxy_http_version 1.1;
            proxy_pass_request_headers off;
            proxy_set_header Host james;
            proxy_set_header Password $http_password;
            proxy_set_header Content-Type application/json;
            proxy_connect_timeout 3s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }
        location / { return 404; }
    }
}
