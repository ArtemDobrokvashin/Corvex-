# HTTP -> HTTPS (кроме ACME challenge для Let's Encrypt)
server {
    listen 80 default_server;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name mail.company.local; # <-- ваш CORVEX_DOMAIN

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    # TLS 1.2+ обязателен; TLS 1.0/1.1 отключены (Chrome 109 на Win7 поддерживает TLS 1.2)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Имена upstream'ов резолвятся лениво (resolver + переменная).
    #
    # Без этого nginx запоминает IP контейнера при старте, и после
    # `docker compose up -d --build web-gateway` (или frontend) сайт отдаёт 502,
    # пока кто-то не догадается перезапустить nginx. Ровно та же ловушка уже
    # описана ниже для Grafana. valid=10s — компромисс: IP кэшируется недолго,
    # но DNS не опрашивается на каждый запрос.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API и WebSocket чата — только через gateway
    location /api/ {
        set $gateway_upstream http://web-gateway:8080;
        proxy_pass $gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Единственный доверенный edge: не пробрасываем клиентский XFF, иначе IP аудита/лимитов можно подделать.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 120s;
    }
    location /ws/ {
        # Переменную нужно объявить в своём location: переменные, заданные в
        # другом location, для этого запроса не существуют.
        set $gateway_upstream http://web-gateway:8080;
        proxy_pass $gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 3600s; # долгоживущие WS-соединения чата
    }

    # Grafana — только с адресов админов (пример подсети, подставить свою) + своя аутентификация Grafana
    location /grafana/ {
        allow 192.168.0.0/16;
        deny all;
        # Имя резолвится лениво тем же resolver'ом: иначе nginx падает при старте,
        # когда Grafana не запущена (профиль monitoring выключен).
        set $grafana_upstream http://grafana:3000;
        proxy_pass $grafana_upstream;
    }

    # SPA фронтенда (контейнер frontend отдаёт статику своим nginx).
    # Переменная нужна, чтобы после пересборки frontend не оставался старый IP.
    location / {
        set $frontend_upstream http://frontend:80;
        proxy_pass $frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
