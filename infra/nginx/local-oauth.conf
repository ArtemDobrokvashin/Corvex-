# Один origin для приёмки OAuth на ноутбуке: http://localhost:8080.
#
# Google и Microsoft принимают только loopback-redirect (http://localhost:PORT) либо
# публичный HTTPS. Домашний стенд отдаёт SPA на https://mail.company.local с самоподписанным
# сертификатом — браузер такому адресу не доверяет, а провайдер требует точного совпадения
# redirect URI. Поэтому для проверки поднимается отдельный nginx: он отдаёт и интерфейс,
# и /api с одного адреса, ровно как боевой перед edge-nginx.
#
# Файл подключается только профилем local-oauth из docker-compose.yml; в обычном запуске
# порт 8080 наружу не публикуется, и этот конфиг не используется.

server {
    listen 80;
    server_name localhost 127.0.0.1;

    # Имена upstream'ов резолвятся лениво: после пересборки контейнера старый IP не залипает.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $gateway_upstream http://web-gateway:8080;
        proxy_pass $gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Единственный доверенный edge: клиентский XFF не пробрасываем.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 120s;
    }

    location /ws/ {
        set $gateway_upstream http://web-gateway:8080;
        proxy_pass $gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 3600s;
    }

    location / {
        set $frontend_upstream http://frontend:80;
        proxy_pass $frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
