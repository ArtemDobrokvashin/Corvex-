user nginx;
worker_processes auto;
events { worker_connections 4096; }
http {
    include /etc/nginx/mime.types;
    sendfile on;
    # Структурный access-log в stdout -> Promtail -> Loki
    log_format json_combined escape=json
      '{"time":"$time_iso8601","remote":"$remote_addr","method":"$request_method","uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,"ua":"$http_user_agent","req_id":"$request_id","upstream_time":"$upstream_response_time"}';
    access_log /dev/stdout json_combined;

    # Лимит тела: вложения почты/чата. Синхронизируется с настройкой admin-service mail.maxMessageSize.
    client_max_body_size 26m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    include /etc/nginx/conf.d/*.conf;
}
