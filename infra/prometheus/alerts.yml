groups:
  - name: corvex
    rules:
      - alert: ServiceDown
        expr: up{job="corvex-services"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Сервис {{ $labels.instance }} недоступен более 2 минут"
      - alert: HighHttp5xxRate
        expr: |
          sum by (application) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            / sum by (application) (rate(http_server_requests_seconds_count[5m])) > 0.05
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Доля 5xx у {{ $labels.application }} выше 5%"
      - alert: MailQueueBacklog
        expr: corvex_mail_queue_depth > 1000
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Очередь обработки почты превышает 1000 сообщений (спам/AV/дставка не успевают)"
      - alert: DiskSpaceLow
        expr: corvex_disk_free_ratio < 0.10
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Свободно менее 10% диска на томе данных (риск остановки почты)"
      - alert: JvmMemoryPressure
        expr: jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"} > 0.90
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Heap {{ $labels.application }} заполнен более чем на 90%"
