global:
  resolve_timeout: 5m
route:
  receiver: corvex-notify
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h          # эскалация: повтор, пока алерт активен
  routes:
    - matchers: [severity="critical"]
      receiver: corvex-notify
      repeat_interval: 30m
receivers:
  # Webhook -> notification-service (очередь corvex.alerts) -> email админам.
  # Сюда же дублируется прямой email через ВНЕШНИЙ SMTP как резервный канал.
  - name: corvex-notify
    webhook_configs:
      - url: http://notification-service:8091/internal/alerts/webhook
        send_resolved: true
inhibit_rules:
  - source_matchers: [alertname="ServiceDown"]
    target_matchers: [severity="warning"]
    equal: [instance]
