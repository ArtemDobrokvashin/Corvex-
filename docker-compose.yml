# =============================================================================
# Corvex — единый compose-файл всей платформы (ТЗ §2.2, §8).
# Запуск:  docker compose --env-file .env up -d --build
# Сети: edge (только nginx+gateway+frontend), app (микросервисы),
#       data (БД/очереди — без публикации портов наружу), monitoring.
# Наружу публикуются ТОЛЬКО: 443 (веб), 25/587 (SMTP), 993/143 (IMAP), 995/110 (POP3).
# =============================================================================
name: corvex

x-java-common: &java-common
  restart: unless-stopped
  environment: &common-env
    TZ: Europe/Moscow
    POSTGRES_HOST: postgres
    POSTGRES_USER: ${POSTGRES_USER:-corvex}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    RABBITMQ_HOST: rabbitmq
    RABBITMQ_USER: ${RABBITMQ_USER:-corvex}
    RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    CORVEX_JWK_SET_URI: http://auth-service:8081/oauth2/jwks
    REDIS_HOST: redis
    REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?Set ELASTIC_PASSWORD in .env}
    CORVEX_MAIL_DOMAINS: ${CORVEX_MAIL_DOMAIN:-company.local}
    CORVEX_EXTERNAL_MAIL_ENABLED: ${CORVEX_EXTERNAL_MAIL_ENABLED:-true}
    CORVEX_EXTERNAL_MAIL_ALLOW_CUSTOM_HOSTS: ${CORVEX_EXTERNAL_MAIL_ALLOW_CUSTOM_HOSTS:-true}
    CORVEX_EXTERNAL_MAIL_ALLOW_PRIVATE_NETWORKS: ${CORVEX_EXTERNAL_MAIL_ALLOW_PRIVATE_NETWORKS:-false}
    CORVEX_EXTERNAL_MAIL_ALLOW_INSECURE_PLAIN: ${CORVEX_EXTERNAL_MAIL_ALLOW_INSECURE_PLAIN:-false}
    CORVEX_DOMAIN: ${CORVEX_DOMAIN:-mail.company.local}
    CORVEX_WEB_ORIGINS: ${CORVEX_WEB_ORIGINS:-https://${CORVEX_DOMAIN:-mail.company.local}}
  networks: [app, data]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  # ------------------------- Инфраструктура данных -------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-corvex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: postgres
    command: ["postgres", "-c", "shared_buffers=1GB", "-c", "max_connections=200", "-c", "log_min_duration_statement=1000"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-corvex}"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [data]
    deploy: { resources: { limits: { memory: 2G } } }

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 6
    networks: [data]

  rabbitmq:
    image: rabbitmq:4.3.7-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-corvex}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      # rabbitmq_stomp нужен как брокер-реле чата: официальный способ включения плагинов образа
      - ./infra/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 8
    networks: [data]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.23
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?Set ELASTIC_PASSWORD in .env}
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    ulimits: { memlock: { soft: -1, hard: -1 } }
    volumes: [elasticsearch-data:/usr/share/elasticsearch/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:$$ELASTIC_PASSWORD http://localhost:9200/_cluster/health | grep -qE 'green|yellow'"]
      interval: 20s
      timeout: 10s
      retries: 10
    networks: [data]
    deploy: { resources: { limits: { memory: 2500M } } }

  # ------------------------- Почтовые фильтры (готовые движки) -------------
  spamd:
    # Официального Apache Docker-образа нет: pinned community-образ на Debian 13
    # (spamd на 783, Pyzor/Razor/DKIM/SPF, sa-update при старте и ежедневно).
    image: grepular/spamassassin:4.0.1-5
    restart: unless-stopped
    volumes: [spamd-data:/var/lib/spamassassin]
    networks: [app]

  clamav:
    image: clamav/clamav:1.5.4
    restart: unless-stopped
    volumes: [clamav-data:/var/lib/clamav]
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 3"]
      interval: 30s
      timeout: 10s
      retries: 10
    networks: [app]

  # ------------------------- Микросервисы Corvex ---------------------------
  auth-service:
    <<: *java-common
    build: ./services/auth-service
    environment:
      <<: *common-env
      CORVEX_JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_private.pem
      CORVEX_TOTP_ENC_KEY: ${CORVEX_TOTP_ENC_KEY:-}
      CORVEX_INTERNAL_API_TOKEN: ${CORVEX_INTERNAL_API_TOKEN:?Set CORVEX_INTERNAL_API_TOKEN in .env}
      CORVEX_LDAP_URL: ${CORVEX_LDAP_URL:-}
      CORVEX_LDAP_BASE: ${CORVEX_LDAP_BASE:-}
      CORVEX_ADMIN_SERVICE_URL: http://admin-service:8090
      CORVEX_BOOTSTRAP_ADMIN_USERNAME: ${CORVEX_BOOTSTRAP_ADMIN_USERNAME:-admin}
      CORVEX_BOOTSTRAP_ADMIN_PASSWORD: ${CORVEX_BOOTSTRAP_ADMIN_PASSWORD:-}
      CORVEX_BOOTSTRAP_ADMIN_EMAIL: ${CORVEX_BOOTSTRAP_ADMIN_EMAIL:-}
    volumes: ["${CORVEX_SECRETS_DIR:-./infra/secrets}:/run/secrets:ro"]
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy } }

  admin-service:
    <<: *java-common
    build: ./services/admin-service
    environment:
      <<: *common-env
      CORVEX_AUTH_SERVICE_URL: http://auth-service:8081
      CORVEX_INTERNAL_API_TOKEN: ${CORVEX_INTERNAL_API_TOKEN:?Set CORVEX_INTERNAL_API_TOKEN in .env}
      CORVEX_BOOTSTRAP_ADMIN_USERNAME: ${CORVEX_BOOTSTRAP_ADMIN_USERNAME:-admin}
      CORVEX_ALERT_CONFIG_ENC_KEY: ${CORVEX_ALERT_CONFIG_ENC_KEY:-}
      CORVEX_ALERT_RECIPIENTS: ${CORVEX_ALERT_RECIPIENTS:-admin@company.local}
      CORVEX_ALERT_FROM: ${CORVEX_ALERT_FROM:-corvex-alert@company.local}
      CORVEX_ALERT_REPEAT_INTERVAL: ${CORVEX_ALERT_REPEAT_INTERVAL:-4h}
      CORVEX_ALERT_CRITICAL_REPEAT_INTERVAL: ${CORVEX_ALERT_CRITICAL_REPEAT_INTERVAL:-30m}
      CORVEX_ALERT_EXTERNAL_EMAIL_ENABLED: ${CORVEX_ALERT_EXTERNAL_EMAIL_ENABLED:-false}
      CORVEX_ALERT_EXTERNAL_EMAIL_RECIPIENTS: ${CORVEX_ALERT_EXTERNAL_EMAIL_RECIPIENTS:-}
      CORVEX_ALERT_EXTERNAL_SMTP_HOST: ${CORVEX_ALERT_EXTERNAL_SMTP_HOST:-}
      CORVEX_ALERT_EXTERNAL_SMTP_PORT: ${CORVEX_ALERT_EXTERNAL_SMTP_PORT:-587}
      CORVEX_ALERT_EXTERNAL_SMTP_TLS_MODE: ${CORVEX_ALERT_EXTERNAL_SMTP_TLS_MODE:-starttls}
      CORVEX_ALERT_EXTERNAL_SMTP_USERNAME: ${CORVEX_ALERT_EXTERNAL_SMTP_USERNAME:-}
      CORVEX_ALERT_EXTERNAL_SMTP_PASSWORD: ${CORVEX_ALERT_EXTERNAL_SMTP_PASSWORD:-}
      CORVEX_ALERT_EXTERNAL_SMTP_FROM: ${CORVEX_ALERT_EXTERNAL_SMTP_FROM:-}
      CORVEX_ALERT_TELEGRAM_ENABLED: ${CORVEX_ALERT_TELEGRAM_ENABLED:-false}
      CORVEX_ALERT_TELEGRAM_BOT_TOKEN: ${CORVEX_ALERT_TELEGRAM_BOT_TOKEN:-}
      CORVEX_ALERT_TELEGRAM_CHAT_ID: ${CORVEX_ALERT_TELEGRAM_CHAT_ID:-}
      CORVEX_ALERT_MAX_ENABLED: ${CORVEX_ALERT_MAX_ENABLED:-false}
      CORVEX_ALERT_MAX_BOT_TOKEN: ${CORVEX_ALERT_MAX_BOT_TOKEN:-}
      CORVEX_ALERT_MAX_CHAT_ID: ${CORVEX_ALERT_MAX_CHAT_ID:-}
      CORVEX_ALERT_MAX_USER_ID: ${CORVEX_ALERT_MAX_USER_ID:-}
    depends_on: { postgres: { condition: service_healthy }, auth-service: { condition: service_healthy } }

  mail-storage-service:
    <<: *java-common
    build: ./services/mail-storage-service
    environment:
      <<: *common-env
      ELASTICSEARCH_URIS: http://elasticsearch:9200
      CORVEX_AUTH_SERVICE_URL: http://auth-service:8081
      CORVEX_INTERNAL_API_TOKEN: ${CORVEX_INTERNAL_API_TOKEN:?Set CORVEX_INTERNAL_API_TOKEN in .env}
      CORVEX_EXTERNAL_MAIL_ENC_KEY: ${CORVEX_EXTERNAL_MAIL_ENC_KEY:-}
      CORVEX_EXTERNAL_MAIL_MAX_ACCOUNTS_PER_USER: ${CORVEX_EXTERNAL_MAIL_MAX_ACCOUNTS_PER_USER:-10}
      CORVEX_EXTERNAL_MAIL_BATCH_SIZE: ${CORVEX_EXTERNAL_MAIL_BATCH_SIZE:-200}
      CORVEX_CLAMD_HOST: clamav
      CORVEX_CLAMD_PORT: 3310
      CORVEX_JAMES_READ_ENABLED: ${CORVEX_JAMES_READ_ENABLED:-false}
      CORVEX_JAMES_READ_ORIGIN: https://james-jmap:8443
      CORVEX_JAMES_READ_PRIVATE_KEY_FILE: /run/james-adapter/jwt-private.pem
      CORVEX_JAMES_READ_TLS_CERTIFICATE_FILE: /run/james-adapter/jmap-trust.crt
      # Dormant until the mTLS bridge, schema and operational policy are ready.
      CORVEX_JAMES_PROVISION_ENABLED: ${CORVEX_JAMES_PROVISION_ENABLED:-false}
      CORVEX_JAMES_PROVISION_ADMIN_ORIGIN: https://james-admin:8443
      CORVEX_JAMES_PROVISION_ADMIN_SECRET_FILE: /run/james-adapter/admin-secret
      CORVEX_JAMES_PROVISION_ADMIN_KEYSTORE_FILE: /run/james-adapter/admin-client.p12
      CORVEX_JAMES_PROVISION_ADMIN_KEYSTORE_PASSWORD_FILE: /run/james-adapter/admin-client-password
      CORVEX_JAMES_PROVISION_ADMIN_TRUST_CERTIFICATE_FILE: /run/james-adapter/admin-trust.crt
      CORVEX_JAMES_PROVISION_JMAP_ORIGIN: https://james-jmap:8443
      CORVEX_JAMES_PROVISION_JMAP_PRIVATE_KEY_FILE: /run/james-adapter/jwt-private.pem
      CORVEX_JAMES_PROVISION_JMAP_TRUST_CERTIFICATE_FILE: /run/james-adapter/jmap-trust.crt
    volumes:
      - mail-data:/data/mail
      - attachment-data:/data/attachments
      - "${CORVEX_JAMES_ADAPTER_DIR:-./infra/secrets/james-adapter}:/run/james-adapter:ro"
    depends_on: { postgres: { condition: service_healthy }, elasticsearch: { condition: service_healthy }, rabbitmq: { condition: service_healthy }, auth-service: { condition: service_healthy } }

  # Candidate engine in the SAME Corvex project; OFF by default. No published
  # ports and no mail route changes. Configuration must be provisioned explicitly.
  james-postgres:
    image: postgres:16.9
    profiles: [james-transition]
    restart: "no"
    environment:
      POSTGRES_DB: james
      POSTGRES_USER: james
      POSTGRES_PASSWORD: ${CORVEX_JAMES_DATABASE_PASSWORD:-}
    entrypoint: ["sh", "-ec", 'test -n "$${POSTGRES_PASSWORD}" || { echo "James database password is required" >&2; exit 1; }; exec docker-entrypoint.sh postgres']
    volumes:
      - james-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U james -d james"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [james-internal]

  james:
    image: apache/james:postgres-3.9.1
    profiles: [james-transition]
    restart: "no"
    depends_on:
      james-postgres: { condition: service_healthy }
    volumes:
      - james-data:/root/var
      - type: bind
        source: ./infra/james/protocols/imapserver.xml
        target: /root/conf/imapserver.xml
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${CORVEX_JAMES_SMTP_CONFIG_FILE:-./infra/james/protocols/smtpserver.xml}
        target: /root/conf/smtpserver.xml
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ./infra/james/protocols/pop3server.xml
        target: /root/conf/pop3server.xml
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ./infra/james/protocols/lmtpserver.xml
        target: /root/conf/lmtpserver.xml
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ./infra/james/protocols/managesieveserver.xml
        target: /root/conf/managesieveserver.xml
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${CORVEX_JAMES_CONFIG_DIR:-./infra/secrets/james}/postgres.properties
        target: /root/conf/postgres.properties
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${CORVEX_JAMES_CONFIG_DIR:-./infra/secrets/james}/jmap.properties
        target: /root/conf/jmap.properties
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${CORVEX_JAMES_CONFIG_DIR:-./infra/secrets/james}/search.properties
        target: /root/conf/search.properties
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${CORVEX_JAMES_CONFIG_DIR:-./infra/secrets/james}/blob.properties
        target: /root/conf/blob.properties
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${CORVEX_JAMES_WEBADMIN_FILE:-${CORVEX_JAMES_CONFIG_DIR:-./infra/secrets/james}/webadmin.properties}
        target: /root/conf/webadmin.properties
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${CORVEX_JAMES_CONFIG_DIR:-./infra/secrets/james}/jwt_publickey
        target: /root/conf/jwt_publickey
        read_only: true
        bind: { create_host_path: false }
    networks: [james-internal]

  # Internal JMAP bridge: reads only; token/owner/RBAC checks still required.
  james-jmap:
    image: corvex-james-jmap-read-gateway:local
    build: ./infra/james/jmap-read-gateway
    profiles: [james-transition]
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      james: { condition: service_started }
    volumes:
      - type: bind
        source: ${CORVEX_JAMES_CONFIG_DIR:-./infra/secrets/james}/jmap.crt
        target: /run/james-tls/jmap.crt
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${CORVEX_JAMES_CONFIG_DIR:-./infra/secrets/james}/jmap.key
        target: /run/james-tls/jmap.key
        read_only: true
        bind: { create_host_path: false }
    networks: [app, james-internal]

  # Separate opt-in internal management bridge. Only mTLS, no published port.
  # The profile does not enable WebAdmin or provisioning automatically.
  james-admin:
    image: nginx:1.31-alpine
    profiles: [james-provision]
    restart: "no"
    depends_on:
      james: { condition: service_started }
    volumes:
      - type: bind
        source: ./infra/james/provision-nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${CORVEX_JAMES_PROVISION_DIR:-./infra/secrets/james-provision}/admin.crt
        target: /run/james-provision/admin.crt
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${CORVEX_JAMES_PROVISION_DIR:-./infra/secrets/james-provision}/admin.key
        target: /run/james-provision/admin.key
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${CORVEX_JAMES_PROVISION_DIR:-./infra/secrets/james-provision}/client-ca.crt
        target: /run/james-provision/client-ca.crt
        read_only: true
        bind: { create_host_path: false }
    networks: [app, james-internal]

  mail-smtp-service:
    <<: *java-common
    build: ./services/mail-smtp-service
    environment:
      <<: *common-env
      # ВНИМАНИЕ: Stage 2A inbound pipeline уже пишет durable spool и ждёт publisher confirm,
      # но включать на проде только после smoke на JDK/Docker-хосте. См. docs/READINESS.md
      CORVEX_SMTP_ENABLED: ${CORVEX_SMTP_ENABLED:-false}
      CORVEX_AUTH_SERVICE_URL: http://auth-service:8081
      CORVEX_ADMIN_SERVICE_URL: http://admin-service:8090
      CORVEX_STORAGE_BASE_URL: http://mail-storage-service:8085
      CORVEX_INTERNAL_API_TOKEN: ${CORVEX_INTERNAL_API_TOKEN:?Set CORVEX_INTERNAL_API_TOKEN in .env}
      CORVEX_DKIM_DOMAIN: ${CORVEX_MAIL_DOMAIN:-company.local}
      CORVEX_DKIM_SELECTOR: ${CORVEX_DKIM_SELECTOR:-corvex1}
      CORVEX_DKIM_PRIVATE_KEY_FILE: /run/secrets/dkim_private.pem
      CORVEX_SMTP_TLS_CERT_FILE: /certs/fullchain.pem
      CORVEX_SMTP_TLS_KEY_FILE: /certs/privkey.pem
    volumes:
      - "${CORVEX_SECRETS_DIR:-./infra/secrets}:/run/secrets:ro"
      - "${CORVEX_CERTS_DIR:-./infra/certs}:/certs:ro"
    ports: ["25:2525", "587:2587"]   # внутри — непривилегированные порты (non-root), наружу — стандартные
    depends_on: { rabbitmq: { condition: service_healthy }, auth-service: { condition: service_healthy }, admin-service: { condition: service_healthy }, mail-storage-service: { condition: service_healthy }, mail-spam-service: { condition: service_healthy }, mail-antivirus-service: { condition: service_healthy } }

  mail-imap-service:
    <<: *java-common
    build: ./services/mail-imap-service
    environment:
      <<: *common-env
      # IMAP на Apache James: включать только после Maven-сборки и клиентского smoke (docs/READINESS.md).
      CORVEX_IMAP_ENABLED: ${CORVEX_IMAP_ENABLED:-false}
      CORVEX_IMAP_PLAIN_ENABLED: ${CORVEX_IMAP_PLAIN_ENABLED:-true}
      CORVEX_IMAP_STARTTLS: ${CORVEX_IMAP_STARTTLS:-true}
      CORVEX_IMAP_TLS_ENABLED: ${CORVEX_IMAP_TLS_ENABLED:-true}
      CORVEX_IMAP_REQUIRE_TLS_FOR_AUTH: ${CORVEX_IMAP_REQUIRE_TLS_FOR_AUTH:-false}
      CORVEX_IMAP_KEYSTORE_PATH: ${CORVEX_IMAP_KEYSTORE_PATH:-/certs/imap.p12}
      CORVEX_IMAP_KEYSTORE_PASSWORD: ${CORVEX_IMAP_KEYSTORE_PASSWORD:-}
      CORVEX_IMAP_KEYSTORE_TYPE: ${CORVEX_IMAP_KEYSTORE_TYPE:-PKCS12}
      CORVEX_AUTH_SERVICE_URL: http://auth-service:8081
      CORVEX_STORAGE_BASE_URL: http://mail-storage-service:8085
      CORVEX_INTERNAL_API_TOKEN: ${CORVEX_INTERNAL_API_TOKEN:?Set CORVEX_INTERNAL_API_TOKEN in .env}
    ports: ["143:1143", "993:1993"]
    volumes: ["${CORVEX_CERTS_DIR:-./infra/certs}:/certs:ro"]
    depends_on: { auth-service: { condition: service_healthy }, mail-storage-service: { condition: service_healthy } }

  mail-pop3-service:
    <<: *java-common
    build: ./services/mail-pop3-service
    environment:
      <<: *common-env
      # POP3 на James protocols: включать только после Maven-сборки и клиентского smoke (docs/READINESS.md).
      CORVEX_POP3_ENABLED: ${CORVEX_POP3_ENABLED:-false}
      CORVEX_POP3_PLAIN_ENABLED: ${CORVEX_POP3_PLAIN_ENABLED:-false}
      CORVEX_AUTH_SERVICE_URL: http://auth-service:8081
      CORVEX_STORAGE_BASE_URL: http://mail-storage-service:8085
      CORVEX_INTERNAL_API_TOKEN: ${CORVEX_INTERNAL_API_TOKEN:?Set CORVEX_INTERNAL_API_TOKEN in .env}
      # implicit TLS 995: PKCS12 из тома certs (конвертацию PEM->P12 см. README сервиса)
      CORVEX_POP3_KEYSTORE_PATH: ${CORVEX_POP3_KEYSTORE_PATH:-/certs/pop3.p12}
      CORVEX_POP3_KEYSTORE_PASSWORD: ${CORVEX_POP3_KEYSTORE_PASSWORD:-}
    ports: ["110:1110", "995:1995"]
    volumes: ["${CORVEX_CERTS_DIR:-./infra/certs}:/certs:ro"]
    depends_on: { auth-service: { condition: service_healthy }, mail-storage-service: { condition: service_healthy } }

  mail-spam-service:
    <<: *java-common
    build: ./services/mail-spam-service
    environment:
      <<: *common-env
      CORVEX_STORAGE_BASE_URL: http://mail-storage-service:8085
      CORVEX_INTERNAL_API_TOKEN: ${CORVEX_INTERNAL_API_TOKEN:?Set CORVEX_INTERNAL_API_TOKEN in .env}
    depends_on: { spamd: { condition: service_started }, rabbitmq: { condition: service_healthy }, mail-storage-service: { condition: service_healthy } }

  mail-antivirus-service:
    <<: *java-common
    build: ./services/mail-antivirus-service
    environment:
      <<: *common-env
      CORVEX_STORAGE_BASE_URL: http://mail-storage-service:8085
      CORVEX_INTERNAL_API_TOKEN: ${CORVEX_INTERNAL_API_TOKEN:?Set CORVEX_INTERNAL_API_TOKEN in .env}
    depends_on: { clamav: { condition: service_healthy }, rabbitmq: { condition: service_healthy }, mail-storage-service: { condition: service_healthy } }

  chat-service:
    <<: *java-common
    build: ./services/chat-service
    environment:
      <<: *common-env
      CORVEX_AUTH_SERVICE_URL: http://auth-service:8081
      CORVEX_INTERNAL_API_TOKEN: ${CORVEX_INTERNAL_API_TOKEN:?Set CORVEX_INTERNAL_API_TOKEN in .env}
      CORVEX_CHAT_GENERAL_ROOM_TITLE: ${CORVEX_CHAT_GENERAL_ROOM_TITLE:-Общий}
    depends_on: { postgres: { condition: service_healthy }, rabbitmq: { condition: service_healthy }, redis: { condition: service_healthy }, auth-service: { condition: service_healthy } }

  chat-file-service:
    <<: *java-common
    build: ./services/chat-file-service
    environment:
      <<: *common-env
      CORVEX_CHAT_SERVICE_URL: http://chat-service:8088
      CORVEX_INTERNAL_API_TOKEN: ${CORVEX_INTERNAL_API_TOKEN:?Set CORVEX_INTERNAL_API_TOKEN in .env}
      CORVEX_CHAT_FILE_ROOT: /data/chat-files
      CORVEX_CHAT_FILE_MAX_BYTES: ${CORVEX_CHAT_FILE_MAX_BYTES:-26214400}
      CORVEX_CHAT_FILE_AV_REQUIRED: ${CORVEX_CHAT_FILE_AV_REQUIRED:-true}
      CORVEX_CLAMD_HOST: clamav
      CORVEX_CLAMD_PORT: 3310
    volumes: [chat-file-data:/data/chat-files]
    depends_on: { auth-service: { condition: service_healthy }, chat-service: { condition: service_healthy }, clamav: { condition: service_healthy } }

  notification-service:
    <<: *java-common
    build: ./services/notification-service
    environment:
      <<: *common-env
      CORVEX_ALERT_RECIPIENTS: ${CORVEX_ALERT_RECIPIENTS:-admin@company.local}
      CORVEX_ALERT_FROM: ${CORVEX_ALERT_FROM:-corvex-alert@company.local}
      CORVEX_ALERT_REPEAT_INTERVAL: ${CORVEX_ALERT_REPEAT_INTERVAL:-4h}
      CORVEX_ALERT_CRITICAL_REPEAT_INTERVAL: ${CORVEX_ALERT_CRITICAL_REPEAT_INTERVAL:-30m}
      CORVEX_ADMIN_SERVICE_URL: http://admin-service:8090
      CORVEX_INTERNAL_API_TOKEN: ${CORVEX_INTERNAL_API_TOKEN:?Set CORVEX_INTERNAL_API_TOKEN in .env}
      ALERT_SMTP_HOST: ${ALERT_SMTP_HOST:-mail-smtp-service}  # рекомендуется ВНЕШНИЙ резервный SMTP
    depends_on: { rabbitmq: { condition: service_healthy }, admin-service: { condition: service_started } }

  web-gateway:
    <<: *java-common
    build: ./services/web-gateway
    networks: [edge, app, data]
    depends_on: { auth-service: { condition: service_healthy }, redis: { condition: service_healthy } }

  frontend:
    build: ./frontend
    restart: unless-stopped
    networks: [edge]

  nginx:
    image: nginx:1.31-alpine
    restart: unless-stopped
    ports: ["443:443", "80:80"]
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - "${CORVEX_CERTS_DIR:-./infra/certs}:/etc/nginx/certs:ro"
    depends_on: [web-gateway, frontend]
    networks: [edge]

  # ------------------------- Мониторинг (профиль monitoring) ---------------
  prometheus:
    image: prom/prometheus:v3.15.1
    profiles: [monitoring]
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d"]
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    networks: [app, monitoring]

  alert-relay:
    build: ./infra/alert-relay
    profiles: [monitoring]
    restart: unless-stopped
    environment:
      CORVEX_ADMIN_SERVICE_URL: http://admin-service:8090
      CORVEX_INTERNAL_API_TOKEN: ${CORVEX_INTERNAL_API_TOKEN:?Set CORVEX_INTERNAL_API_TOKEN in .env}
      CORVEX_ALERT_REPEAT_INTERVAL: ${CORVEX_ALERT_REPEAT_INTERVAL:-4h}
      CORVEX_ALERT_CRITICAL_REPEAT_INTERVAL: ${CORVEX_ALERT_CRITICAL_REPEAT_INTERVAL:-30m}
      CORVEX_ALERT_EXTERNAL_EMAIL_ENABLED: ${CORVEX_ALERT_EXTERNAL_EMAIL_ENABLED:-false}
      CORVEX_ALERT_EXTERNAL_EMAIL_RECIPIENTS: ${CORVEX_ALERT_EXTERNAL_EMAIL_RECIPIENTS:-}
      CORVEX_ALERT_EXTERNAL_SMTP_HOST: ${CORVEX_ALERT_EXTERNAL_SMTP_HOST:-}
      CORVEX_ALERT_EXTERNAL_SMTP_PORT: ${CORVEX_ALERT_EXTERNAL_SMTP_PORT:-587}
      CORVEX_ALERT_EXTERNAL_SMTP_TLS_MODE: ${CORVEX_ALERT_EXTERNAL_SMTP_TLS_MODE:-starttls}
      CORVEX_ALERT_EXTERNAL_SMTP_USERNAME: ${CORVEX_ALERT_EXTERNAL_SMTP_USERNAME:-}
      CORVEX_ALERT_EXTERNAL_SMTP_PASSWORD: ${CORVEX_ALERT_EXTERNAL_SMTP_PASSWORD:-}
      CORVEX_ALERT_EXTERNAL_SMTP_FROM: ${CORVEX_ALERT_EXTERNAL_SMTP_FROM:-}
      CORVEX_ALERT_TELEGRAM_ENABLED: ${CORVEX_ALERT_TELEGRAM_ENABLED:-false}
      CORVEX_ALERT_TELEGRAM_BOT_TOKEN: ${CORVEX_ALERT_TELEGRAM_BOT_TOKEN:-}
      CORVEX_ALERT_TELEGRAM_CHAT_ID: ${CORVEX_ALERT_TELEGRAM_CHAT_ID:-}
      CORVEX_ALERT_MAX_ENABLED: ${CORVEX_ALERT_MAX_ENABLED:-false}
      CORVEX_ALERT_MAX_BOT_TOKEN: ${CORVEX_ALERT_MAX_BOT_TOKEN:-}
      CORVEX_ALERT_MAX_CHAT_ID: ${CORVEX_ALERT_MAX_CHAT_ID:-}
      CORVEX_ALERT_MAX_USER_ID: ${CORVEX_ALERT_MAX_USER_ID:-}
      CORVEX_ALERT_EXTERNAL_CA_FILE: ${CORVEX_ALERT_EXTERNAL_CA_FILE:-}
      CORVEX_ALERT_EXTERNAL_TIMEOUT_SECONDS: ${CORVEX_ALERT_EXTERNAL_TIMEOUT_SECONDS:-10}
    volumes:
      - "${CORVEX_ALERT_CA_DIR:-./infra/alert-ca}:/etc/corvex/alert-ca:ro"
      - alert-relay-data:/var/lib/corvex-alert-relay
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8092/healthz', timeout=2).close()"]
      interval: 15s
      timeout: 5s
      retries: 4
    networks: [monitoring, app]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  alertmanager:
    image: prom/alertmanager:v0.34.2
    profiles: [monitoring]
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/etc/corvex/alertmanager-entrypoint.sh"]
    command: ["--config.file=/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    volumes:
      - "./infra/prometheus/alertmanager.yml:/etc/corvex/alertmanager.template.yml:ro"
      - "./infra/prometheus/alertmanager-entrypoint.sh:/etc/corvex/alertmanager-entrypoint.sh:ro"
      - "alertmanager-data:/alertmanager"
    networks: [monitoring, app]

  grafana:
    image: grafana/grafana:13.3.0
    profiles: [monitoring]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD in .env}
      GF_SERVER_ROOT_URL: "https://${CORVEX_DOMAIN:-localhost}/grafana/"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    networks: [monitoring, edge]

  loki:
    image: grafana/loki:3.7.9
    profiles: [monitoring]
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./infra/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    networks: [monitoring, app]

  promtail:
    image: grafana/promtail:3.6.11
    profiles: [monitoring]
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - ./infra/loki/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [monitoring]

networks:
  edge: {}        # nginx <-> gateway/frontend/grafana (единственная сеть с портами наружу, кроме почтовых)
  app: {}         # микросервисы между собой и с фильтрами
  data:           # БД/очереди/поиск: порты наружу НЕ публикуются
    internal: true
  monitoring: {}
  james-internal:
    internal: true

volumes:
  postgres-data: {}
  james-postgres-data: {}  # isolated from existing Corvex PostgreSQL
  james-data: {}           # James persistent data, not the legacy Maildir volume
  redis-data: {}
  rabbitmq-data: {}
  elasticsearch-data: {}
  mail-data: {}        # Maildir — самая ценная часть бэкапа
  attachment-data: {}  # CAS вложений по SHA-256
  chat-file-data: {}
  spamd-data: {}
  clamav-data: {}
  prometheus-data: {}
  alertmanager-data: {}
  alert-relay-data: {}  # last-good runtime config, включая write-only channel secrets (0600)
  grafana-data: {}
  loki-data: {}
