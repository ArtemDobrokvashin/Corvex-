# =============================================================================
# Corvex — единый compose-файл всей платформы (ТЗ §2.2, §8).
# Запуск:  docker compose --env-file .env up -d --build
# Сети: edge (только nginx+gateway+frontend), app (микросервисы),
#       data (БД/очереди — без публикации портов наружу), monitoring.
# Наружу публикуются ТОЛЬКО: 443 (веб), 25/587 (SMTP), 993/143 (IMAP), 995/110 (POP3).
# =============================================================================
name: corvex

x-java-common: &java-common
  restart: unless-stopped
  environment: &common-env
    TZ: Europe/Moscow
    POSTGRES_HOST: postgres
    POSTGRES_USER: ${POSTGRES_USER:-corvex}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    RABBITMQ_HOST: rabbitmq
    RABBITMQ_USER: ${RABBITMQ_USER:-corvex}
    RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    CORVEX_JWK_SET_URI: http://auth-service:8081/oauth2/jwks
    REDIS_HOST: redis
    REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?Set ELASTIC_PASSWORD in .env}
    CORVEX_MAIL_DOMAINS: ${CORVEX_MAIL_DOMAIN:-company.local}
  networks: [app, data]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  # ------------------------- Инфраструктура данных -------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-corvex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: postgres
    command: ["postgres", "-c", "shared_buffers=1GB", "-c", "max_connections=200", "-c", "log_min_duration_statement=1000"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-corvex}"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [data]
    deploy: { resources: { limits: { memory: 2G } } }

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 6
    networks: [data]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-corvex}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      # rabbitmq_stomp нужен как брокер-реле чата: официальный способ включения плагинов образа
      - ./infra/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 8
    networks: [data]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.2
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?Set ELASTIC_PASSWORD in .env}
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    ulimits: { memlock: { soft: -1, hard: -1 } }
    volumes: [elasticsearch-data:/usr/share/elasticsearch/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:$$ELASTIC_PASSWORD http://localhost:9200/_cluster/health | grep -qE 'green|yellow'"]
      interval: 20s
      timeout: 10s
      retries: 10
    networks: [data]
    deploy: { resources: { limits: { memory: 2500M } } }

  # ------------------------- Почтовые фильтры (готовые движки) -------------
  spamd:
    image: apache/spamassassin:4.0.1
    restart: unless-stopped
    volumes: [spamd-data:/var/lib/spamassassin]
    networks: [app]

  clamav:
    image: clamav/clamav:1.3
    restart: unless-stopped
    volumes: [clamav-data:/var/lib/clamav]
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 3"]
      interval: 30s
      timeout: 10s
      retries: 10
    networks: [app]

  # ------------------------- Микросервисы Corvex ---------------------------
  auth-service:
    <<: *java-common
    build: ./services/auth-service
    environment:
      <<: *common-env
      CORVEX_JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_private.pem
      CORVEX_TOTP_ENC_KEY: ${CORVEX_TOTP_ENC_KEY:-}
      CORVEX_LDAP_URL: ${CORVEX_LDAP_URL:-}
      CORVEX_LDAP_BASE: ${CORVEX_LDAP_BASE:-}
    volumes: ["${CORVEX_SECRETS_DIR:-./infra/secrets}:/run/secrets:ro"]
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy } }

  admin-service:
    <<: *java-common
    build: ./services/admin-service
    depends_on: { postgres: { condition: service_healthy }, auth-service: { condition: service_healthy } }

  mail-storage-service:
    <<: *java-common
    build: ./services/mail-storage-service
    environment:
      <<: *common-env
      ELASTICSEARCH_URIS: http://elasticsearch:9200
    volumes:
      - mail-data:/data/mail
      - attachment-data:/data/attachments
    depends_on: { postgres: { condition: service_healthy }, elasticsearch: { condition: service_healthy } }

  mail-smtp-service:
    <<: *java-common
    build: ./services/mail-smtp-service
    environment:
      <<: *common-env
      # ВНИМАНИЕ: включать ТОЛЬКО когда mail-storage перестанет быть заглушкой (этап 2 плана),
      # иначе принятые письма будут подтверждены отправителю (250 OK) и потеряны. См. docs/READINESS.md
      CORVEX_SMTP_ENABLED: ${CORVEX_SMTP_ENABLED:-false}
    ports: ["25:2525", "587:2587"]   # внутри — непривилегированные порты (non-root), наружу — стандартные
    depends_on: { rabbitmq: { condition: service_healthy } }

  mail-imap-service:
    <<: *java-common
    build: ./services/mail-imap-service
    ports: ["143:1143", "993:1993"]
    volumes: ["${CORVEX_CERTS_DIR:-./infra/certs}:/certs:ro"]
    depends_on: { auth-service: { condition: service_healthy } }

  mail-pop3-service:
    <<: *java-common
    build: ./services/mail-pop3-service
    ports: ["110:1110", "995:1995"]
    volumes: ["${CORVEX_CERTS_DIR:-./infra/certs}:/certs:ro"]
    depends_on: { auth-service: { condition: service_healthy } }

  mail-spam-service:
    <<: *java-common
    build: ./services/mail-spam-service
    depends_on: [spamd, rabbitmq]

  mail-antivirus-service:
    <<: *java-common
    build: ./services/mail-antivirus-service
    depends_on: { clamav: { condition: service_healthy } }

  chat-service:
    <<: *java-common
    build: ./services/chat-service
    depends_on: { postgres: { condition: service_healthy }, rabbitmq: { condition: service_healthy }, redis: { condition: service_healthy } }

  chat-file-service:
    <<: *java-common
    build: ./services/chat-file-service
    volumes: [chat-file-data:/data/chat-files]
    depends_on: { mail-antivirus-service: { condition: service_started } }

  notification-service:
    <<: *java-common
    build: ./services/notification-service
    environment:
      <<: *common-env
      CORVEX_ALERT_RECIPIENTS: ${CORVEX_ALERT_RECIPIENTS:-admin@corp.local}
      ALERT_SMTP_HOST: ${ALERT_SMTP_HOST:-mail-smtp-service}  # рекомендуется ВНЕШНИЙ резервный SMTP
    depends_on: { rabbitmq: { condition: service_healthy } }

  web-gateway:
    <<: *java-common
    build: ./services/web-gateway
    networks: [edge, app, data]
    depends_on: { auth-service: { condition: service_healthy }, redis: { condition: service_healthy } }

  frontend:
    build: ./frontend
    restart: unless-stopped
    networks: [edge]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["443:443", "80:80"]
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - "${CORVEX_CERTS_DIR:-./infra/certs}:/etc/nginx/certs:ro"
    depends_on: [web-gateway, frontend]
    networks: [edge]

  # ------------------------- Мониторинг (профиль monitoring) ---------------
  prometheus:
    image: prom/prometheus:v2.52.0
    profiles: [monitoring]
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d"]
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    networks: [app, monitoring]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    profiles: [monitoring]
    restart: unless-stopped
    volumes: ["./infra/prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro"]
    networks: [monitoring, app]

  grafana:
    image: grafana/grafana:11.0.0
    profiles: [monitoring]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD in .env}
      GF_SERVER_ROOT_URL: "https://${CORVEX_DOMAIN:-localhost}/grafana/"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    networks: [monitoring, edge]

  loki:
    image: grafana/loki:3.0.0
    profiles: [monitoring]
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./infra/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    networks: [monitoring, app]

  promtail:
    image: grafana/promtail:3.0.0
    profiles: [monitoring]
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - ./infra/loki/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [monitoring]

networks:
  edge: {}        # nginx <-> gateway/frontend/grafana (единственная сеть с портами наружу, кроме почтовых)
  app: {}         # микросервисы между собой и с фильтрами
  data:           # БД/очереди/поиск: порты наружу НЕ публикуются
    internal: true
  monitoring: {}

volumes:
  postgres-data: {}
  redis-data: {}
  rabbitmq-data: {}
  elasticsearch-data: {}
  mail-data: {}        # Maildir — самая ценная часть бэкапа
  attachment-data: {}  # CAS вложений по SHA-256
  chat-file-data: {}
  spamd-data: {}
  clamav-data: {}
  prometheus-data: {}
  grafana-data: {}
  loki-data: {}
