server {
  listen 80;
  root /usr/share/nginx/html;

  # Хешированные файлы сборки неизменяемы: имя меняется вместе с содержимым.
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }

  # index.html ссылается на конкретные хеши. Если браузер оставит старую копию,
  # после пересборки он запросит удалённые файлы и покажет старый интерфейс
  # (или пустую страницу). Поэтому точка входа всегда ревалидируется; 304 при
  # отсутствии изменений стоит один запрос и ничего не ломает.
  # Манифест и иконки PWA кешируются отдельно: их имена стабильны, а браузер
  # перезапрашивает манифест заметно реже бандла.
  location = /manifest.webmanifest {
    types { } default_type application/manifest+json;
    add_header Cache-Control "public, max-age=3600" always;
    try_files $uri =404;
  }

  location ~* ^/icon-(192|512|maskable-512)\.png$ {
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri $uri/ /index.html;
  }

}
