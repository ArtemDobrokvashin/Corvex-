version: 2

# Dependabot предлагает только сгруппированные minor/patch-обновления.
# Major-версии автоматически не предлагаются: каждая крупная миграция готовится
# вручную одним отдельным изменением и проходит ворота из
# docs/RELEASE-DEPENDENCIES.md. Это предотвращает десятки однотипных PR по
# каждому каталогу сервисов.
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 1
    groups:
      frontend-production:
        dependency-type: production
        update-types: [minor, patch]
      frontend-development:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
      # Tailwind 4 требует Chrome 111+, а Corvex обязан поддерживать Chrome 109.
      - dependency-name: tailwindcss
        update-types: [version-update:semver-major]
      # Babel остаётся в major 7 для legacy-цепочки Chrome 109.
      - dependency-name: "@babel/core"
        update-types: [version-update:semver-major]

  - package-ecosystem: maven
    directories:
      - /
      - /services/admin-service
      - /services/auth-service
      - /services/chat-file-service
      - /services/chat-service
      - /services/mail-antivirus-service
      - /services/mail-imap-service
      - /services/mail-pop3-service
      - /services/mail-smtp-service
      - /services/mail-spam-service
      - /services/mail-storage-service
      - /services/notification-service
      - /services/web-gateway
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Europe/Moscow
    open-pull-requests-limit: 1
    groups:
      maven-patch-minor:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: docker
    directories:
      - /frontend
      - /services/admin-service
      - /services/auth-service
      - /services/chat-file-service
      - /services/chat-service
      - /services/mail-antivirus-service
      - /services/mail-imap-service
      - /services/mail-pop3-service
      - /services/mail-smtp-service
      - /services/mail-spam-service
      - /services/mail-storage-service
      - /services/notification-service
      - /services/web-gateway
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 1
    groups:
      docker-base-images:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Europe/Moscow
    open-pull-requests-limit: 1
    groups:
      compose-images:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
