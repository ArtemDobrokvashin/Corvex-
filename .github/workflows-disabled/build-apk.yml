name: Android APK

# Сборка debug APK и прогон Kotlin-тестов клиента.
#
# Зачем это здесь: в песочнице, где ведётся разработка, нет JDK и Android SDK,
# а значит ни одна строка Kotlin не была скомпилирована до телефона. Здесь
# компилятор доступен, и его вывод виден в логе — по нему правятся ошибки.
#
# Файл лежит в workflows-disabled, потому что у GitHub-приложения, которым
# ведётся работа, нет права `workflows`. Включение — одна команда:
#   cd C:\corvex-android
#   git pull --ff-only
#   New-Item -ItemType Directory -Force .github\workflows | Out-Null
#   Move-Item .github\workflows-disabled\build-apk.yml .github\workflows\build-apk.yml -Force
#   git add . ; git commit -m "ci: сборка APK" ; git push
on:
  push:
    paths:
      - '.github/workflows/build-apk.yml'
      - 'android/**'
  workflow_dispatch:

jobs:
  apk:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Unit tests
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --console=plain --no-daemon

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --console=plain --no-daemon

      - name: Test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: |
            android/app/build/reports/tests/**
            android/app/build/test-results/**
          retention-days: 7

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: corvex-debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
